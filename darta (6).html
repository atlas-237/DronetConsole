  /* ---------- factories ---------- */
  /* A panel shows its overall value when collapsed; the detail expands.
     This is what allows all data families to fit on one screen
     without giving them all to read at once. */
  function section(cls, title, content, note, tight, fold){
    const body=el("div",{class:"ph-body"},
      el("div",{class:"panel-body"+(tight?" tight":"")}, content),
      note ? el("div",{style:"padding:9px 14px; border-top:1px solid var(--line-soft)"},
        el("p",{class:"dim", style:"font-size:11.5px"},note)) : null);
    if(!fold){
      return el("section",{class:"panel "+cls},
        el("div",{class:"panel-head"}, el("span",{class:"accent"}), el("h2",{},title)),
        body);
    }
    const open = !fold.collapsed;
    body.hidden = !open;
    const head=el("button",{class:"ph-btn","aria-expanded":String(open),
      onclick:e=>{ const now=e.currentTarget.getAttribute("aria-expanded")!=="true";
        e.currentTarget.setAttribute("aria-expanded",String(now)); body.hidden=!now; }},
      el("span",{class:"accent"}), el("h2",{},title),
      el("span",{class:"ph-sum"},
        fold.sumV!=null ? el("span",{class:"v", "data-sum":"v"},fold.sumV) : null,
        fold.sumU ? el("span",{class:"u"},fold.sumU) : null),
      chevron());
    return el("section",{class:"panel "+cls}, head, body);
  }
  function setSum(panel, v){
    const n=panel.querySelector('.ph-sum .v'); if(n) n.textContent=v;
  }
  function chevron(){
    const s=document.createElementNS("http://www.w3.org/2000/svg","svg");
    s.setAttribute("class","ph-chev"); s.setAttribute("viewBox","0 0 24 24");
    s.setAttribute("fill","none"); s.setAttribute("stroke","currentColor");
    s.setAttribute("stroke-width","2"); s.setAttribute("stroke-linecap","round");
    s.setAttribute("stroke-linejoin","round"); s.setAttribute("width","15"); s.setAttribute("height","15");
    s.innerHTML='<path d="m9 6 6 6-6 6"/>'; return s;
  }
  function breakdown({cls, title, lead, unit, sub, parts, facts}){
    const leadEl=el("span",{class:"v num"},fmt(lead));
    const bar=el("div",{class:"stack"});
    const segs=parts.map(([,v,c])=>{ const sp=el("span",{style:"background:"+getCSS(c)}); bar.append(sp); return sp; });
    const legend=el("div",{class:"legend"});
    const legVals=[], legPct=[];
    parts.forEach(([n,v,c])=>{
      const vv=el("span",{class:"v"},fmt(v)); const pp=el("span",{class:"p"},"");
      legVals.push(vv); legPct.push(pp);
      legend.append(el("div",{class:"leg"},
        el("span",{class:"sw", style:"background:"+getCSS(c)}),
        el("span",{class:"n"},n), vv, pp));
    });
    const factsBox=el("div",{class:"facts"});
    const factVals=[];
    facts.forEach(([k,v,tone])=>{
      const node=fact(k,v,null,tone); factVals.push(node.querySelector(".v")); factsBox.append(node);
    });
    const sumV=el("span",{class:"v"},fmt(lead));
    const body=el("div",{class:"ph-body"},
      el("div",{class:"panel-body", style:"padding:12px 16px 14px"},
        el("div",{class:"sub"},sub), bar, legend),
      factsBox);
    body.hidden = !!arguments[0].collapsed;
    const head=el("button",{class:"ph-btn","aria-expanded":String(!arguments[0].collapsed),
      onclick:e=>{ const now=e.currentTarget.getAttribute("aria-expanded")!=="true";
        e.currentTarget.setAttribute("aria-expanded",String(now)); body.hidden=!now; }},
      el("span",{class:"accent"}), el("h2",{},title),
      el("span",{class:"ph-sum"}, sumV, el("span",{class:"u"},unit)),
      chevron());
    const node=el("section",{class:"panel "+cls}, head, body);
    function apply(vals){
      const tot=vals.reduce((a,b)=>a+b,0)||1;
      vals.forEach((v,i)=>{
        segs[i].style.width=(v/tot*100)+"%";
        legVals[i].textContent=fmt(v);
        legPct[i].textContent=Math.round(v/tot*100)+" %";
      });
    }
    apply(parts.map(p=>p[1]));
    return { node, update(d){ leadEl.textContent=fmt(d.lead); sumV.textContent=fmt(d.lead); apply(d.parts);
      d.facts.forEach((v,i)=>{ factVals[i].textContent = typeof v==="number"?fmt(v):v; }); } };
  }
  function fact(k,v,help,tone){
    const zero=(v===0||v==="0");
    return el("div",{class:"fact"},
      el("div",{class:"k"}, k, help?el("span",{class:"info", title:help, tabindex:"0",
        role:"note","aria-label":help},"i"):null),
      el("div",{class:"v"+(zero&&!tone?" zero":"")+(tone?" is-"+tone:"")},
        typeof v==="number"?fmt(v):v));
  }
}

/* Compact curve: a single polyline, no axes or grid — it indicates
   a trend, not a value. */
function sparkline(series, color){
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","spark"); svg.setAttribute("viewBox","0 0 100 26");
  svg.setAttribute("preserveAspectRatio","none"); svg.setAttribute("aria-hidden","true");
  const area=document.createElementNS("http://www.w3.org/2000/svg","path");
  area.setAttribute("fill", color); area.setAttribute("fill-opacity",".14");
  const line=document.createElementNS("http://www.w3.org/2000/svg","path");
  line.setAttribute("fill","none"); line.setAttribute("stroke", color);
  line.setAttribute("stroke-width","1.5"); line.setAttribute("vector-effect","non-scaling-stroke");
  svg.append(area, line); svg.__parts={area,line};
  redrawSpark(svg, series); return svg;
}
function redrawSpark(svg, series){
  if(!svg || !svg.__parts || !series.length) return;
  const min=Math.min(...series), max=Math.max(...series), span=(max-min)||1;
  const pts=series.map((v,i)=>[ i/(series.length-1||1)*100, 26-((v-min)/span)*22-2 ]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(2)+" "+p[1].toFixed(2)).join(" ");
  svg.__parts.line.setAttribute("d", d);
  svg.__parts.area.setAttribute("d", d+` L100 26 L0 26 Z`);
}

/* ============================================================
   SCREEN — OBSERVATIONS  (§7.4)
   Four readings of the same corpus: the immutable history, the
   current state per identity, the state at a past instant, and the delta
   between two instants. These are four distinct contract endpoints, so
   four explicit modes rather than a disguised filter.
   ============================================================ */
const OBS_TYPES = [
  ["radio.wifi",      "Wi-Fi",       "--wifi"],
  ["radio.bluetooth", "Bluetooth",   "--bt"],
  ["asset.telemetry", "Telemetry",  "--cls-drone"],
  ["camera.capture",  "Capture",     "--cls-tablet"]
];
const obsLabel = t => (OBS_TYPES.find(x=>x[0]===t)||[,t])[1];
const obsColor = t => getCSS((OBS_TYPES.find(x=>x[0]===t)||[,,"--n500"])[2]);
const hhmmss = ts => new Date(ts).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
const dmhm   = ts => new Date(ts).toLocaleString("en-US",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});

function screenObs(){
  const view=$("#view"); view.classList.remove("is-map"); view.innerHTML="";
  const page=el("div",{class:"page", style:"max-width:1320px"});
  if(state.scenario==="error"){ view.append(errorState("the observations")); return; }

  const f = { mode:"history", types:new Set(OBS_TYPES.map(t=>t[0])),
              q:"", asset:"", zone:"", asOf:60, from:40, to:60, page:0 };
  const PER = 25, MAX_ROWS = 200;   /* display ceiling, see truncation */

  page.append(el("div",{class:"page-head"},
    el("div",{class:"grow"},
      el("h1",{},"Observations"),
      el("p",{},"Immutable detection history. The most recent first."))));

  /* --- modes --- */
  const modes=el("div",{class:"obs-modes", role:"group","aria-label":"Reading mode"});
  [["history","History"],["current","Current state"],
   ["snapshot","Snapshot"],["changes","Changes"]].forEach(([id,label])=>{
    modes.append(el("button",{"aria-pressed":String(f.mode===id),
      onclick:()=>{ f.mode=id; f.page=0;
        $$("button",modes).forEach(b=>b.setAttribute("aria-pressed","false"));
        event.currentTarget.setAttribute("aria-pressed","true"); paint(); }}, label));
  });

  const search=el("input",{class:"input grow", placeholder:"Search for a fingerprint or a vendor",
    "aria-label":"Search", oninput:e=>{ f.q=e.target.value; f.page=0; paint(); }});
  const assetSel=el("select",{class:"input", style:"width:auto", "aria-label":"Asset",
    onchange:e=>{ f.asset=e.target.value; f.page=0; paint(); }},
    el("option",{value:""},"All assets"),
    ...DB.assets.map(a=>el("option",{value:a.id},a.name)));
  const zoneSel=el("select",{class:"input", style:"width:auto", "aria-label":"Zone",
    onchange:e=>{ f.zone=e.target.value; f.page=0; paint(); }},
    el("option",{value:""},"All zones"),
    ...["North perimeter","Air corridor"].map(z=>el("option",{value:z},z)),
    el("option",{value:"__none"},"Outside zone"));

  page.append(el("div",{class:"obs-bar"}, modes, search, assetSel, zoneSel, purgeBtn()));

  const typeBar=el("div",{class:"obs-bar"});
  OBS_TYPES.forEach(([id,label,col])=>{
    typeBar.append(el("button",{class:"tchip","aria-pressed":"true",
      onclick:e=>{ const on=e.currentTarget.getAttribute("aria-pressed")!=="true";
        e.currentTarget.setAttribute("aria-pressed",String(on));
        on ? f.types.add(id) : f.types.delete(id); f.page=0; paint(); }},
      el("span",{class:"g", style:"background:"+getCSS(col)+
        (id==="radio.wifi"?";transform:rotate(45deg)":";border-radius:50%")}), label));
  });
  const timeBox=el("div",{class:"obs-bar"});
  page.append(typeBar, timeBox);

  const note=el("p",{class:"obs-note"},"");
  const box=el("section",{class:"panel"});
  page.append(note, box);
  view.append(page);

  /* --- selection by mode --- */
  function base(){
    return DB.observations.filter(o=>{
      if(!f.types.has(o.type)) return false;
      if(f.asset && o.asset_id!==f.asset) return false;
      if(f.zone==="__none" && o.zone) return false;
      if(f.zone && f.zone!=="__none" && o.zone!==f.zone) return false;
      if(f.q){
        const q=f.q.toLowerCase();
        if(!((o.identity||"").toLowerCase().includes(q) ||
             (o.vendor||"").toLowerCase().includes(q) ||
             o.id.toLowerCase().includes(q))) return false;
      }
      return true;
    });
  }
  const span = ()=>{ const l=DB.observations; return [l[l.length-1].at, l[0].at]; };
  const atPct = p => { const [a,b]=span(); return a + (b-a)*p/100; };

  function dataset(){
    const all=base();
    if(f.mode==="history") return {rows:all, kind:"list"};
    if(f.mode==="current"){
      const seen=new Map();
      all.forEach(o=>{ const k=o.identity||o.asset_id+"/"+o.type;
        if(!seen.has(k)) seen.set(k,o); });          /* already sorted: the most recent wins */
      return {rows:[...seen.values()], kind:"list"};
    }
    if(f.mode==="snapshot"){
      const t=atPct(f.asOf); const seen=new Map();
      all.filter(o=>o.at<=t).forEach(o=>{ const k=o.identity||o.asset_id+"/"+o.type;
        if(!seen.has(k)) seen.set(k,o); });
      return {rows:[...seen.values()], kind:"list", at:t};
    }
    /* changes: two snapshots compared */
    const t1=atPct(Math.min(f.from,f.to)), t2=atPct(Math.max(f.from,f.to));
    const snap=t=>{ const m=new Map();
      all.filter(o=>o.at<=t).forEach(o=>{ const k=o.identity||o.asset_id+"/"+o.type;
        if(!m.has(k)) m.set(k,o); }); return m; };
    const A=snap(t1), B=snap(t2), out=[];
    B.forEach((o,k)=>{ if(!A.has(k)) out.push({...o, delta:"entry"});
      else if(A.get(k).id!==o.id) out.push({...o, delta:"update"}); });
    A.forEach((o,k)=>{ if(!B.has(k)) out.push({...o, delta:"exit"}); });
    return {rows:out.sort((a,b)=>b.at-a.at), kind:"delta", from:t1, to:t2};
  }

  function paintTime(){
    timeBox.innerHTML="";
    if(f.mode==="snapshot"){
      const lab=el("span",{class:"mono", style:"font-size:12.5px; color:var(--text-2)"}, dmhm(atPct(f.asOf)));
      timeBox.append(el("span",{class:"dim", style:"font-size:12.5px"},"State at"), 
        el("input",{type:"range", min:"0", max:"100", value:String(f.asOf), class:"grow",
          "aria-label":"Reference time",
          oninput:e=>{ f.asOf=+e.target.value; lab.textContent=dmhm(atPct(f.asOf)); f.page=0; paint(true); }}),
        lab);
    } else if(f.mode==="changes"){
      const l1=el("span",{class:"mono", style:"font-size:12.5px; color:var(--text-2)"}, dmhm(atPct(f.from)));
      const l2=el("span",{class:"mono", style:"font-size:12.5px; color:var(--text-2)"}, dmhm(atPct(f.to)));
      timeBox.append(el("span",{class:"dim", style:"font-size:12.5px"},"From"),
        el("input",{type:"range", min:"0", max:"100", value:String(f.from), class:"grow",
          "aria-label":"Start time",
          oninput:e=>{ f.from=+e.target.value; l1.textContent=dmhm(atPct(f.from)); paint(true); }}), l1,
        el("span",{class:"dim", style:"font-size:12.5px"},"to"),
        el("input",{type:"range", min:"0", max:"100", value:String(f.to), class:"grow",
          "aria-label":"End time",
          oninput:e=>{ f.to=+e.target.value; l2.textContent=dmhm(atPct(f.to)); paint(true); }}), l2);
    }
  }

  const NOTES = {
    history:"Each row is a timestamped detection. The history cannot be modified.",
    current:"One row per identity: its last known detection.",
    snapshot:"State reconstructed at the chosen instant, identity by identity.",
    changes:"Gap between two instants: entries, exits and updates."
  };

  function paint(keepTime){
    if(!keepTime) paintTime();
    note.textContent = NOTES[f.mode];
    box.innerHTML="";
    if(state.scenario==="loading"){ box.append(loadingState(7)); return; }

    const ds = state.scenario==="empty" ? {rows:[],kind:"list"} : dataset();
    const total=ds.rows.length;
    const truncated = total>MAX_ROWS;
    const shown = truncated ? ds.rows.slice(0,MAX_ROWS) : ds.rows;
    const pages = Math.max(1, Math.ceil(shown.length/PER));
    f.page=Math.min(f.page, pages-1);
    const slice = shown.slice(f.page*PER, (f.page+1)*PER);

    box.append(el("div",{class:"panel-head"},
      el("h2",{}, f.mode==="changes" ? "Changes" : "Results"),
      el("div",{class:"right"},
        el("span",{class:"badge"}, fmt(total)+(total>1?" observations":" observation")),
        el("button",{class:"btn btn-sm", onclick:()=>exportObs(shown)},"Export"))));

    if(!total){
      box.append(emptyState(
        state.scenario==="empty" ? "No observations in this period"
                                 : "No results for these criteria",
        state.scenario==="empty"
          ? "The sensors are transmitting normally — nothing was detected. Widen the window."
          : "No observation matches the active filters.",
        "Reset the filters", ()=>{
          f.q=""; search.value=""; f.asset=""; assetSel.value="";
          f.zone=""; zoneSel.value=""; f.types=new Set(OBS_TYPES.map(t=>t[0]));
          $$(".tchip",typeBar).forEach(b=>b.setAttribute("aria-pressed","true"));
          f.page=0; paint();
        }));
      return;
    }

    const heads=["Time","Type","Identity","Vendor","Device","Power","Zone"];
    if(ds.kind==="delta") heads.splice(1,0,"Change");
    box.append(el("div",{class:"panel-body tight"}, el("div",{class:"tablewrap"},
      table(heads, slice.map(o=>{
        const row=[
          el("span",{class:"mono", style:"font-size:12.5px"}, hhmmss(o.at)),
          el("span",{style:"display:flex; align-items:center; gap:6px"},
            el("span",{style:"width:8px;height:8px;flex:0 0 auto;background:"+obsColor(o.type)+
              (o.type==="radio.wifi"?";transform:rotate(45deg)":";border-radius:50%")}),
            obsLabel(o.type)),
          o.identity ? el("span",{class:"mono", style:"font-size:12.5px"},o.identity)
                     : el("span",{class:"dim"},"—"),
          o.vendor || el("span",{class:"dim"},"—"),
          (DB.assets.find(a=>a.id===o.asset_id)||{}).name || "—",
          o.rssi!=null ? el("span",{class:"mono"},o.rssi+" dBm") : el("span",{class:"dim"},"—"),
          o.zone || el("span",{class:"dim"},"outside zone")
        ];
        if(ds.kind==="delta"){
          const cls = o.delta==="entry"?"delta-in":o.delta==="exit"?"delta-out":"delta-up";
          row.splice(1,0,el("span",{class:cls, style:"font-weight:600; font-size:12.5px"},o.delta));
        }
        return row;
      }), o=>openObs(o), slice))));

    if(truncated){
      box.append(el("div",{class:"trunc"},
        el("span",{},"Display limited to "+fmt(MAX_ROWS)+" observations out of "+fmt(total)+
          ". Refine the filters or reduce the period to see everything."),
        el("button",{class:"btn btn-sm", style:"margin-left:auto",
          onclick:()=>search.focus()},"Refine")));
    }
    box.append(el("div",{style:"padding:10px 14px; border-top:1px solid var(--line-soft); display:flex; align-items:center; gap:9px"},
      el("span",{class:"dim", style:"font-size:12px; margin-right:auto"},
        "Page "+(f.page+1)+" of "+pages),
      el("button",{class:"btn btn-sm", disabled:f.page===0?"":null,
        onclick:()=>{ f.page--; paint(true); }},"Previous"),
      el("button",{class:"btn btn-sm", disabled:f.page>=pages-1?"":null,
        onclick:()=>{ f.page++; paint(true); }},"Next")));
  }

  /* --- observation card + history summary --- */
  function openObs(o){
    const same = o.identity ? DB.observations.filter(x=>x.identity===o.identity) : [o];
    const seenBy=[...new Set(same.map(x=>x.asset_id))]
      .map(id=>(DB.assets.find(a=>a.id===id)||{}).name).filter(Boolean);
    const del=el("button",{class:"btn btn-danger",
      onclick:()=>{ scrim.remove(); confirmWithText({ title:"Delete this observation ?",
        body: el("p",{class:"muted"},
          "Deletion is permanent and will be recorded in the security log. The identity history remains available via the other observations."),
        word:"delete", confirm:"Delete permanently", danger:true,
        onConfirm:()=>{ const i=DB.observations.indexOf(o);
          if(i>=0){ DB.observations.splice(i,1); paint(true);
            toast("Observation deleted.", ()=>{ DB.observations.splice(i,0,o); paint(true); }); } } }); }},
      "Delete");
    gate(del,"observation.delete");
    const close=()=>scrim.remove();
    const scrim=el("div",{class:"scrim", onclick:e=>{ if(e.target===scrim) close(); }},
      el("div",{class:"modal", role:"dialog","aria-modal":"true","aria-label":"Observation"},
        el("div",{class:"modal-head"}, el("h2",{},"Observation"),
          el("span",{class:"badge", style:"margin-left:auto"}, obsLabel(o.type))),
        el("div",{class:"modal-body"},
          el("div",{class:"kv", style:"border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden"},
            kv("Identifier", o.id, true),
            kv("Timestamp", dmhm(o.at)+" "+hhmmss(o.at)),
            kv("Identity", o.identity || "—", true),
            kv("Vendor", o.vendor || "—"),
            kv("Source device", (DB.assets.find(a=>a.id===o.asset_id)||{}).name || "—"),
            kv("Position", o.lat.toFixed(5)+", "+o.lng.toFixed(5), true),
            kv("Power", o.rssi!=null ? o.rssi+" dBm" : "—"),
            kv("Band", o.band || "—"),
            kv("Zone", o.zone || "outside zone"),
            kv("Artifact", o.artifact || "—", true)),
          o.artifact ? artifactPreview(o) : null,
          el("h3",{style:"font-size:13px; margin:16px 0 8px"},"History summary"),
          o.identity
            ? el("div",{class:"kv", style:"border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden"},
                kv("Detections", fmt(same.length)),
                kv("First", dmhm(same[same.length-1].at)),
                kv("Last", dmhm(same[0].at)),
                kv("Seen by", seenBy.join(", ") || "—"))
            : el("p",{class:"muted", style:"font-size:13px"},
                "This observation does not carry a state identity: it has no aggregated history."),
          el("p",{class:"dim", style:"font-size:12px; margin-top:14px"},
            "Observations are immutable: they can neither be modified nor replayed, only deleted.")),
        el("div",{class:"modal-foot"}, del,
          el("button",{class:"btn btn-primary", onclick:close},"Close"))));
    $("#modalRoot").append(scrim);
  }

  function purgeBtn(){
    const b=el("button",{class:"btn btn-sm",
      onclick:()=>modal({ title:"Delete filtered observations?",
        body: el("p",{class:"muted"},
          "All observations matching the active filters will be permanently deleted."),
        confirm:"Delete", danger:true,
        onConfirm:()=>toast("Observations deleted.") })},"Delete selection");
    return gate(b,"observation.delete");
  }
  function exportObs(rows){
    const head=["id","timestamp","type","identity","vendor","device","rssi","zone"];
    const body=rows.map(o=>[o.id, new Date(o.at).toISOString(), o.type, o.identity||"",
      o.vendor||"", (DB.assets.find(a=>a.id===o.asset_id)||{}).name||"", o.rssi??"", o.zone||""]);
    const csv=[head,...body].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\n");
    const url=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));
    const a=el("a",{href:url, download:"darta-observations.csv"}); a.click();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast(fmt(rows.length)+" observations exported.");
  }

  paint();
}

function accessDenied(ic, text){
  return el("div",{class:"panel"}, el("div",{class:"state"},
    el("div",{class:"ico"}, icon(ic)),
    el("h3",{},"Restricted access"),
    el("p",{},text),
    el("div",{class:"actions"}, el("button",{class:"btn", onclick:()=>go("map")},"Back to map"))));
}
/* ============================================================
   SCREEN — ARTIFACTS  (§ Artifacts)
   Camera captures produce a binary file distinct from the
   observation. This screen browses them as thumbnails served by
   /artifacts/{id}/thumbnail; the full file remains on the server
   and is retrieved via /artifacts/{id}/content.
   ============================================================ */
function artifactsOf(){
  return DB.observations.filter(o=>o.artifact).map(o=>({
    id:o.artifact, obs:o,
    /* deterministic metadata: the server actually returns them */
    bytes: 180000 + ((parseInt(o.artifact.replace(/\D/g,""),10)*7919)%1500000),
    w:4056, h:3040, mime:"image/jpeg"
  }));
}
const kb = n => n>=1048576 ? (n/1048576).toFixed(1).replace(".",",")+" MB"
                           : Math.round(n/1024)+" KB";

/* Artifact detail modal — reusable from the Artifacts gallery
   and from the Asset Console. onChange is called after deletion/undo. */
function openArtifactModal(a, onChange){
  const o=a.obs;
  const asset=(DB.assets.find(x=>x.id===o.asset_id)||{}).name||"—";
  const big=el("div",{class:"gbig", html:artifactThumb(o)});
  big.append(el("div",{class:"meta", style:"position:absolute; left:0; right:0; bottom:0; padding:8px 11px;"+
    "background:linear-gradient(transparent,rgba(0,0,0,.78)); font-family:var(--mono); font-size:11.5px;"+
    "color:#e8eaec; display:flex; justify-content:space-between"},
    el("span",{}, dmhm(o.at)+" "+hhmmss(o.at)),
    el("span",{}, o.lat.toFixed(5)+", "+o.lng.toFixed(5))));

  const del=el("button",{class:"btn btn-danger", onclick:()=>{
    scrim.remove();
    confirmWithText({ title:"Delete this artifact ?",
      body: el("p",{class:"muted"},
        "The file is permanently deleted. The observation that produced it remains available, without the image."),
      word:"delete", confirm:"Delete permanently", danger:true,
      onConfirm:()=>{ const prev=o.artifact; o.artifact=null;
        DB.audit.unshift({ at:hhmm(), actor:DB.user.email, action:"artifact.delete",
          target:a.id, result:"success" });
        onChange && onChange();
        toast("Artifact deleted.", ()=>{ o.artifact=prev; DB.audit.shift(); onChange && onChange(); }); } });
  }},"Delete");
  gate(del,"observation.delete");

  const close=()=>scrim.remove();
  const mapNode = el("div", { class: "map-canvas" });
  const sideMap = el("div", { class: "artifact-side-map" }, mapNode);
  const leftCol = el("div", {},
    big,
    el("div",{class:"kv", style:"border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden; margin-top:14px"},
      kv("Identifier", a.id, true),
      kv("Observation", o.id, true),
      kv("Device", asset),
      kv("Timestamp", dmhm(o.at)+" "+hhmmss(o.at)),
      kv("Position", o.lat.toFixed(5)+", "+o.lng.toFixed(5), true),
      kv("Zone", o.zone || "outside zone"),
      kv("Resolution", fmt(a.w)+" × "+fmt(a.h)+" px"),
      kv("Size", kb(a.bytes))),
    el("p",{class:"dim", style:"font-size:12px; margin-top:12px"},
      "Thumbnail served by /artifacts/"+a.id+"/thumbnail. The original file is retrieved "+
      "via /artifacts/"+a.id+"/content, with the same rights as the observation that produced it."));

  const scrim=el("div",{class:"scrim", onclick:e=>{ if(e.target===scrim) close(); }},
    el("div",{class:"modal", style:"width:min(1180px,100%)", role:"dialog","aria-modal":"true",
      "aria-label":"Artifact"},
      el("div",{class:"modal-head"}, el("h2",{},"Artifact"),
        el("span",{class:"badge", style:"margin-left:auto"}, a.mime)),
      el("div",{class:"modal-body", style:"padding-bottom:0"},
        el("div", { class: "artifact-modal-layout" },
          leftCol,
          sideMap)),
      el("div",{class:"modal-foot"},
        del,
        el("button",{class:"btn", onclick:()=>toast("Downloading the original file.")},"Download"))));

  $("#modalRoot").append(scrim);

  loadMaps().then((maps)=>{
    if(!mapNode.isConnected) return;
    const drone = DB.assets.find(x => x.id === o.asset_id) || null;
    const focus = drone ? { lat: drone.lat, lng: drone.lng } : { lat: o.lat, lng: o.lng };
    const map = new maps.Map(mapNode, mapOptions({ center: focus, zoom: 16 }));

    if (drone) {
      const droneMarker = new maps.Marker({
        map,
        position: { lat: drone.lat, lng: drone.lng },
        title: drone.name,
        zIndex: 10,
        icon: {
          url: svgIcon(assetBody(drone), 42, drone.asset_type === "drone" ? (drone.heading || 0) : 0),
          scaledSize: new maps.Size(42, 42),
          anchor: new maps.Point(21, 21)
        }
      });
    }

    /* The path the device travelled to reach this artifact, not just
       its two endpoints — same route generator as the Asset screen. */
    const route = drone ? routeFor(drone) : null;
    if (route) {
      new maps.Polyline({ map, path: route,
        strokeColor: getCSS("--select"), strokeWeight: 3, strokeOpacity: .6, zIndex: 4 });
    }

    const obsMarker = new maps.Marker({
      map,
      position:{ lat:o.lat, lng:o.lng },
      title: "Observation",
      zIndex: 5,
      icon:{
        path: google.maps.SymbolPath.CIRCLE,
        scale: 8,
        fillColor: "#f7c66a",
        fillOpacity: 1,
        strokeColor: "#f0f4ff",
        strokeWeight: 2
      }
    });

    const bounds = new maps.LatLngBounds();
    bounds.extend({ lat: o.lat, lng: o.lng });
    if (drone) bounds.extend({ lat: drone.lat, lng: drone.lng });
    if (route) route.forEach(p => bounds.extend(p));
    if (bounds.getNorthEast().equals(bounds.getSouthWest())) {
      map.setCenter(focus);
      map.setZoom(16);
    } else {
      map.fitBounds(bounds, { top: 30, right: 30, bottom: 30, left: 30 });
    }
  }).catch(()=>{
    mapNode.innerHTML = "";
    mapNode.append(el("div", { style:"display:grid; place-items:center; height:100%; color:var(--text-3); font-size:12px;" }, "Map unavailable"));
  });
}

/* Mission summary — zones, assigned assets and images captured by these
   assets, gathered in a single place. Read only: no mutation, so no
   need to recall paintList/paintDetail/drawMap like editMission
   or deleteMission. Opened as a modal rather than a tab: the Missions
   panel is narrow (392px), an image gallery would be too cramped
   there to remain readable. */
/* Collapsible section — same mechanics as the map legend (§ Live
   Map): clickable header, chevron that rotates, content hidden without
   being destroyed. Reused for each block of the mission summary, which can
   become long once zones/assets/events/images are all present. */
function foldSection(title, contentNode, startOpen=true){
  let open=startOpen;
  const chevIcon=icon("chev");
  const head=el("button",{class:"lb-head", style:"font-size:13px; color:var(--text); margin:0 0 8px"},
    el("span",{},title), chevIcon);
  const wrapEl=el("div",{}, contentNode);
  function paint(){
    chevIcon.style.transform = open ? "rotate(90deg)" : "rotate(-90deg)";
    head.setAttribute("aria-expanded", String(open));
    head.setAttribute("aria-label", (open?"Collapse ":"Expand ")+title.replace(/\s*\(\d+\)$/,""));
    wrapEl.style.display = open ? "" : "none";
  }
  head.onclick=()=>{ open=!open; paint(); };
  paint();
  return el("div",{style:"margin-top:18px"}, head, wrapEl);
}

function missionSummaryModal(m){
  const assets = m.asset_ids.map(id=>DB.assets.find(a=>a.id===id)).filter(Boolean);
  const missionObs = DB.observations.filter(o=>m.asset_ids.includes(o.asset_id));
  const wifiObs = missionObs.filter(o=>o.type==="radio.wifi");
  const btObs   = missionObs.filter(o=>o.type==="radio.bluetooth");
  const wifiUnique = new Set(wifiObs.map(o=>o.identity)).size;
  const btUnique   = new Set(btObs.map(o=>o.identity)).size;
  const artifacts = artifactsOf().filter(x=>m.asset_ids.includes(x.obs.asset_id))
    .sort((x,y)=>y.obs.at-x.obs.at);

  /* Events per zone: the real API (GET .../missions/{id}/events) would
     already return them grouped by zone, typed detected/entered/departed and
     traced back to the source observation. In mock mode, we approximate
     with the zone field already present on each observation — a single type
     of event (detection), for lack of an entry/exit state modeled here. */
  const eventsOf = zoneName => DB.observations.filter(o=>o.zone===zoneName).sort((a,b)=>b.at-a.at);
  const entityLabel = o=>{
    if(o.type==="asset.telemetry"||o.type==="camera.capture"){
      const a=DB.assets.find(x=>x.id===o.asset_id); return a?a.name:"Unknown asset";
    }
    return o.identity || "Unknown address";
  };
  const entityBadge = o=>
    o.type==="asset.telemetry"||o.type==="camera.capture" ? "Asset" :
    o.type==="radio.wifi" ? "Wi-Fi" : o.type==="radio.bluetooth" ? "Bluetooth" : "—";

  const close=()=>{ scrim.remove(); document.removeEventListener("keydown",esc); };
  const esc=e=>{ if(e.key==="Escape") close(); };

  const body=el("div",{},
    el("div",{class:"kv", style:"border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden"},
      kv("Status", missionStatusLabel(m)==="active"?"Active":missionStatusLabel(m)==="pending"?"Pending approval":"Disabled"),
      kv("Requested by", m.requested_by||"—"),
      kv("Zones", String(m.areas.length)),
      kv("Assigned assets", String(assets.length)),
      kv("Radio signals", fmt(wifiUnique)+" Wi-Fi · "+fmt(btUnique)+" Bluetooth (unique)"),
      kv("Captured images", String(artifacts.length))),

    foldSection("Zones ("+m.areas.length+")",
      !m.areas.length
        ? el("p",{class:"dim", style:"font-size:12.5px"},"No zone drawn for this mission.")
        : el("div",{style:"border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden"},
            ...m.areas.map(z=>el("div",{class:"listrow"},
              el("span",{class:"swatch", style:"background:"+(z.type==="exclusion"?getCSS("--zone-ex-line"):getCSS("--zone-op-line"))}),
              el("span",{class:"body"}, el("span",{class:"t"},z.name),
                el("span",{class:"s"}, z.type==="exclusion"?"Exclusion zone":"Operational zone",
                  " · ", areaKm2(z.points).toFixed(2)+" km²")))))),

    foldSection("Assets ("+assets.length+")",
      !assets.length
        ? el("p",{class:"dim", style:"font-size:12.5px"},"No assigned assets for this mission.")
        : el("div",{style:"border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden"},
            ...assets.map(a=>el("button",{class:"listrow",
              onclick:()=>{ close(); state.asset=a.id; go("asset"); }},
              el("span",{class:"swatch", style:"background:"+assetColor(a)}),
              el("span",{class:"body"}, el("span",{class:"t"},a.name),
                el("span",{class:"s"}, a.asset_type==="drone"?"Drone":"Station", " · ", a.last)),
              icon("chev"))))),

    foldSection("Radio signals",
      !missionObs.length
        ? el("p",{class:"dim", style:"font-size:12.5px"},
            "No Wi-Fi or Bluetooth signal captured by the assets of this mission.")
        : el("div",{class:"kv", style:"border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden"},
            kv("Wi-Fi", fmt(wifiUnique)+" unique device"+(wifiUnique>1?"s":"")+
              " · "+fmt(wifiObs.length)+" detection"+(wifiObs.length>1?"s":"")),
            kv("Bluetooth", fmt(btUnique)+" unique device"+(btUnique>1?"s":"")+
              " · "+fmt(btObs.length)+" detection"+(btObs.length>1?"s":"")))),

    foldSection("Events per zone",
      el("div",{},
        el("p",{class:"dim", style:"font-size:11.5px; margin:-2px 0 10px"},
          "Approximation from observations — entry/exit are not yet distinguished here, pending connection of the mission events API."),
        !m.areas.length
          ? el("p",{class:"dim", style:"font-size:12.5px"},"No zone, therefore no events to display.")
          : el("div",{}, ...m.areas.map(z=>{
              const evs=eventsOf(z.name);
              return el("div",{style:"margin-bottom:14px"},
                el("div",{style:"display:flex; align-items:center; gap:7px; margin-bottom:6px"},
                  el("span",{class:"swatch", style:"background:"+(z.type==="exclusion"?getCSS("--zone-ex-line"):getCSS("--zone-op-line"))}),
                  el("span",{style:"font-size:12.5px; font-weight:600"}, z.name),
                  el("span",{class:"dim", style:"font-size:11.5px"}, "· "+evs.length+" event"+(evs.length>1?"s":""))),
                !evs.length
                  ? el("p",{class:"dim", style:"font-size:12px; margin-left:18px"},"No events recorded in this zone.")
                  : el("div",{style:"border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden"},
                      ...evs.slice(0,8).map(o=>el("div",{class:"listrow", style:"padding:8px 12px"},
                        el("span",{class:"badge", style:"flex:0 0 auto"}, entityBadge(o)),
                        el("span",{class:"body"}, el("span",{class:"t", style:"font-size:12.5px"}, entityLabel(o)),
                          el("span",{class:"s"}, "detected · "+hhmmss(o.at))))),
                      evs.length>8 ? el("div",{class:"dim", style:"padding:7px 12px; font-size:11px"},
                        "+"+(evs.length-8)+" more") : null));
            }))),
      false),

    foldSection("Images ("+artifacts.length+")",
      !artifacts.length
        ? el("p",{class:"dim", style:"font-size:12.5px"},
            "No images captured by the assets of this mission.")
        : el("div",{},
            el("div",{class:"gal gal-mini"}, ...artifacts.slice(0,24).map(art=>
              el("button",{class:"gcard", title:dmhm(art.obs.at)+" "+hhmmss(art.obs.at),
                onclick:()=>openArtifactModal(art, ()=>{})},
                el("span",{class:"im", html:artifactThumb(art.obs)})))),
          artifacts.length>24 ? el("p",{class:"dim", style:"font-size:11.5px; margin-top:8px"},
            "24 most recent of "+artifacts.length+".") : null)));

  const scrim=el("div",{class:"scrim", onclick:e=>{ if(e.target===scrim) close(); }},
    el("div",{class:"modal", style:"width:min(640px,100%)", role:"dialog","aria-modal":"true",
      "aria-label":"Mission summary — "+m.name},
      el("div",{class:"modal-head"},
        el("span",{class:"swatch", style:"background:"+m.color+"; width:11px; height:11px; border-radius:3px; flex:0 0 auto"}),
        el("h2",{},"Summary — "+m.name),
        missionStatusBadge(m)),
      el("div",{class:"modal-body"}, body),
      el("div",{class:"modal-foot"},
        el("button",{class:"btn btn-primary", onclick:close},"Close"))));
  document.addEventListener("keydown",esc);
  $("#modalRoot").append(scrim);
}

function screenArtifacts(){
  const view=$("#view"); view.classList.remove("is-map"); view.innerHTML="";
  const page=el("div",{class:"page", style:"max-width:1320px"});
  if(state.scenario==="error"){ view.append(errorState("the artifacts")); return; }

  const f={ q:"", asset:state.artifactAssetFilter||"", zone:"", page:0 };
  state.artifactAssetFilter=null;
  const PER=12;

  page.append(el("div",{class:"page-head"},
    el("div",{class:"grow"},
      el("h1",{},"Artifacts"),
      el("p",{},"Images produced by camera captures. The original file remains on the server."))));

  const search=el("input",{class:"input", style:"max-width:260px",
    placeholder:"Search for an identifier", "aria-label":"Search",
    oninput:e=>{ f.q=e.target.value; f.page=0; paint(); }});
  const assetSel=el("select",{class:"input", style:"width:auto", "aria-label":"Asset",
    onchange:e=>{ f.asset=e.target.value; f.page=0; paint(); }},
    el("option",{value:"", selected:f.asset===""?"":null},"All assets"),
    ...DB.assets.map(a=>el("option",{value:a.id, selected:a.id===f.asset?"":null},a.name)));
  const zoneSel=el("select",{class:"input", style:"width:auto", "aria-label":"Zone",
    onchange:e=>{ f.zone=e.target.value; f.page=0; paint(); }},
    el("option",{value:""},"All zones"),
    ...["North perimeter","Air corridor"].map(z=>el("option",{value:z},z)),
    el("option",{value:"__none"},"Outside zone"));
  page.append(el("div",{class:"obs-bar"}, search, assetSel, zoneSel));

  const box=el("section",{class:"panel"});
  page.append(box);
  view.append(page);

  function rows(){
    return artifactsOf().filter(a=>{
      const o=a.obs;
      if(f.asset && o.asset_id!==f.asset) return false;
      if(f.zone==="__none" && o.zone) return false;
      if(f.zone && f.zone!=="__none" && o.zone!==f.zone) return false;
      if(f.q && !a.id.toLowerCase().includes(f.q.toLowerCase())) return false;
      return true;
    });
  }

  function paint(){
    box.innerHTML="";
    if(state.scenario==="loading"){ box.append(loadingState(6)); return; }
    const all = state.scenario==="empty" ? [] : rows();
    const pages=Math.max(1, Math.ceil(all.length/PER));
    f.page=Math.min(f.page, pages-1);
    const slice=all.slice(f.page*PER,(f.page+1)*PER);
    const totalBytes=all.reduce((n,a)=>n+a.bytes,0);

    box.append(el("div",{class:"panel-head"}, el("h2",{},"Images"),
      el("div",{class:"right"},
        el("span",{class:"badge"}, fmt(all.length)+" file"+(all.length>1?"s":"")),
        all.length ? el("span",{class:"dim", style:"font-size:12px"}, kb(totalBytes)) : null)));

    if(!all.length){
      box.append(emptyState(
        state.scenario==="empty" ? "No image in this period" : "No artifact matches",
        state.scenario==="empty"
          ? "No camera capture has been transmitted. Devices without the camera.capture capability do not produce any."
          : "No file matches the active filters.",
        "Reset", ()=>{ f.q=""; search.value=""; f.asset=""; assetSel.value="";
          f.zone=""; zoneSel.value=""; f.page=0; paint(); }));
      return;
    }

    const grid=el("div",{class:"gal"});
    slice.forEach(a=>{
      const o=a.obs;
      const asset=(DB.assets.find(x=>x.id===o.asset_id)||{}).name||"—";
      grid.append(el("button",{class:"gcard", onclick:()=>openArtifactModal(a, paint)},
        el("span",{class:"im", html:artifactThumb(o)},
          el("span",{class:"tag"}, hhmmss(o.at))),
        el("span",{class:"inf"},
          el("span",{class:"a", style:"display:block"}, asset),
          el("span",{class:"b", style:"display:block"}, a.id+" · "+kb(a.bytes)))));
    });
    box.append(grid);

    box.append(el("div",{style:"padding:10px 14px; border-top:1px solid var(--line-soft); display:flex; align-items:center; gap:9px"},
      el("span",{class:"dim", style:"font-size:12px; margin-right:auto"},
        "Page "+(f.page+1)+" of "+pages),
      el("button",{class:"btn btn-sm", disabled:f.page===0?"":null,
        onclick:()=>{ f.page--; paint(); }},"Previous"),
      el("button",{class:"btn btn-sm", disabled:f.page>=pages-1?"":null,
        onclick:()=>{ f.page++; paint(); }},"Next")));
  }

  paint();
}

   USER ACCOUNTS
   POST /users requires {display_name, email, password, role}. The password
   is therefore entered or generated here — there is no email

const USER_ROLES=[["operator","Operator","Operational pages and readings. No administration."],
                  ["admin","Administrator","Manages users, assets, capabilities and credentials."]];
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function randomPassword(){
  const A="ABCDEFGHJKLMNPQRSTUVWXYZ", a="abcdefghijkmnopqrstuvwxyz", n="23456789", sy="!@#$%&*?";
  const all=A+a+n+sy; const out=[A,a,n,sy].map(g=>g[Math.floor(Math.random()*g.length)]);
  while(out.length<16) out.push(all[Math.floor(Math.random()*all.length)]);
  return out.sort(()=>Math.random()-.5).join("");
}

/* ------------------------------------------------------------
   User tokens — JWT, not API keys
   Same principle as for devices: single display,
   revocable, scope limited to the bearer's role.
   ------------------------------------------------------------ */
function issueUserJwt(u, tok){
  const header={ alg:"RS256", typ:"JWT", kid:"darta-user-2026" };
  const payload={
    iss:"https://api.dartasystems.ai", aud:"drone-net",
    sub:"user:"+u.id, jti:tok.id, typ:"user",
    email:u.email, role:u.role, scope:tok.scope,
    iat:Math.floor(tok.issued/1000), exp:Math.floor(tok.expires/1000)
  };
  let sig=""; const A="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
  let sd=0; for(const c of tok.id+u.id) sd=(sd*31+c.charCodeAt(0))>>>0;
  for(let i=0;i<86;i++){ sd=(sd*1664525+1013904223)>>>0; sig+=A[sd%A.length]; }
  return { token: b64url(header)+"."+b64url(payload)+"."+sig, header, payload };
}

/* The actor type is deduced from the address: human, machine or system.
   Shared by the Security log screen and its detail modal. */
function actorType(l){
  if(l.actor==="system" || l.actor==="system") return "system";
  if(/^(asset|device|cred)[:_]/i.test(l.actor)) return "asset";
  return "user";
}

    el("div",{class:"grow"}, el("h1",{},"Security log"),
      el("p",{},"Human, system and machine actions. Entries cannot be modified or deleted."))));

  if(state.scenario==="loading"){ page.append(loadingState(7)); view.append(page); return; }
  if(state.scenario==="error"){ view.append(errorState("the security log")); return; }

  /* Filters aligned with GET /audit-log: actor_type, result_group,
     sort and direction. Each corresponds to a query parameter. */
  const f={ q:"", actor_type:"", result_group:"", sort:"at", direction:"desc" };
  const resultGroup = l => l.result==="success" ? "success" : "other";

  const search=el("input",{class:"input", style:"max-width:280px",

    el("option",{value:"other"},"Failures and refusals"));
  const sortSel=el("select",{class:"input", style:"width:auto", "aria-label":"Sort by",
    onchange:e=>{ f.sort=e.target.value; paint(); }},
    el("option",{value:"at"},"Sort by time"),

  const resetBtn=el("button",{class:"btn btn-sm btn-quiet", onclick:()=>{

  const box=el("section",{class:"panel"});
  page.append(box);

  function rowsOf(){
    let r=DB.audit.filter(l=>{
      if(f.actor_type && actorType(l)!==f.actor_type) return false;
      if(f.result_group && resultGroup(l)!==f.result_group) return false;
      if(f.q){
        const q=f.q.toLowerCase();

      }

    const key = l => f.sort==="actor" ? l.actor : f.sort==="action" ? l.action : l.at;
    r=[...r].sort((a,b)=>{
      const x=key(a), y=key(b);
      return f.direction==="asc" ? String(x).localeCompare(String(y))
                                 : String(y).localeCompare(String(x));
    });
    return r;
  }

  function paint(){
    box.innerHTML="";
    const rows=rowsOf();
    const active=[f.actor_type&&ACTOR_LABEL[f.actor_type],
                  f.result_group&&(f.result_group==="success"?"successful":"failures"),
                  f.q&&"« "+f.q+" »"].filter(Boolean);
    box.append(el("div",{class:"panel-head"}, el("h2",{},"Entries"),
      el("div",{class:"right"},
        active.length ? el("span",{class:"dim", style:"font-size:12px"},
          "filtered: "+active.join(" · ")) : null,
        el("span",{class:"badge"}, fmt(rows.length)+" of "+fmt(DB.audit.length)),
        el("button",{class:"btn btn-sm", onclick:()=>exportAudit(rows)},"Export"))));
    if(!rows.length){
      box.append(emptyState("No matching entries",
        "No actions match these criteria in the retained period (90 days).",
        "Reset", ()=>resetBtn.click()));
      return;
    }
    box.append(el("div",{class:"panel-body tight"}, el("div",{class:"tablewrap"},
      table(["Time","Actor","Type","Action","Target","Result"],
        rows.map(l=>[
          el("span",{class:"mono"},l.at),
          el("span",{class:"mono", style:"font-size:12.5px"},l.actor),
          el("span",{class:"badge"}, ACTOR_LABEL[actorType(l)]),
          el("span",{class:"mono", style:"font-size:12.5px"},l.action),
          l.target,
          l.result==="success" ? el("span",{class:"badge badge-ok"},"success")
                               : el("span",{class:"badge badge-warn"},"other")]),
        l=>auditDetailModal(l), rows))));
    box.append(el("div",{style:"padding:10px 16px; border-top:1px solid var(--line-soft)"},
      el("p",{class:"dim", style:"font-size:12px"},
        "Retained for 90 days. The export is signed so the recipient can verify its integrity.")));
  }
  function exportAudit(rows){
    const head=["time","actor","type","action","target","result"];
    const body=rows.map(l=>[l.at,l.actor,ACTOR_LABEL[actorType(l)],l.action,l.target,l.result]);
    const csv=[head,...body].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\n");
    const url=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));
    const a=el("a",{href:url, download:"darta-audit.csv"}); a.click();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast(fmt(rows.length)+" entries exported.");
  }
  paint();
  view.append(page);
}

function table(heads, rows, onRow, items){
  const t=el("table",{class:"tbl"});
  t.append(el("thead",{}, el("tr",{}, ...heads.map(h=>el("th",{},h)))));
  t.append(el("tbody",{}, ...rows.map((r,i)=>{
    const tr=el("tr",{}, ...r.map(c=>el("td",{},c)));
    if(onRow){ tr.style.cursor="pointer"; tr.tabIndex=0;
      const go=()=>onRow(items?items[i]:i);
      tr.addEventListener("click",go);
      tr.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
    } else tr.style.cursor="default";
    return tr;
  })));
  return t;
}

const SCREENS = { map:screenMap, asset:screenAsset, mission:screenMission,
                  ops:screenOps, obs:screenObs, artifacts:screenArtifacts, users:screenUsers,
                  "asset-registry":screenAssetsAdmin, "mission-approval":screenMissionApproval,
                  audit:screenAudit, account:screenAccount, settings:screenSettings };

function go(r){ location.hash = "#/"+r; }

/* Back button: returns to whichever screen the user actually came
   from, not a fixed destination. We keep our own stack (route + the
   bits of state that make a screen what it is, e.g. which asset) since
   several screens share the same hash route and only differ by state
   (asset id, mission id…), so browser history alone can't tell them apart. */
let backStack=[];
let suppressBackCapture=false;
function goBack(){
  if(!backStack.length) return;
  const prev=backStack.pop();
  suppressBackCapture=true;
  Object.assign(state, prev);
  if(location.hash !== "#/"+prev.route){
    location.hash = "#/"+prev.route;
  } else {
    suppressBackCapture=false;
    render();
  }
}
function updateBackButton(){
  const b=$("#backBtn");
  if(b) b.classList.toggle("hidden", backStack.length===0);
}

/* Any timer opened by a screen is registered here and cleared on
   view change: without this the dashboard refresh would
   keep running on other screens. */
let pageTimers=[];
function setPageInterval(fn, ms){ const id=setInterval(fn, ms); pageTimers.push(id); return id; }
function clearPageTimers(){ pageTimers.forEach(clearInterval); pageTimers=[]; }

/* Same principle for anything that is not a timer: requestAnimationFrame
   loop of a video player, listeners placed on window...
   Without this, leaving the Asset screen during playback leaves the map and
   the animation continuing to run on a DOM that no longer exists. */
let pageCleanups=[];
function onPageLeave(fn){ pageCleanups.push(fn); }
function runPageCleanups(){ pageCleanups.forEach(fn=>{ try{ fn(); }catch(e){} }); pageCleanups=[]; }

function render(){
  runPageCleanups();
  clearPageTimers();
  const fn=SCREENS[state.route];
  buildNav(); buildCrumbs(); updateBackButton();
  if(!fn){
    const v=$("#view"); v.classList.remove("is-map"); v.innerHTML="";
    v.append(el("div",{class:"page"}, el("div",{class:"panel"},
      el("div",{class:"state"},
        el("div",{class:"ico"}, icon("alert")),
        el("h3",{},"Page not found"),
        el("p",{},"This address does not match any screen. It may have been renamed."),
        el("div",{class:"actions"}, el("button",{class:"btn btn-primary", onclick:()=>go("map")},"Back to map"))))));
    return;
  }
  fn();
}
function readHash(){
  const r=(location.hash||"#/map").replace(/^#\//,"").split("/")[0];
  const nextRoute = r || "map";
  if(!suppressBackCapture && nextRoute!==state.route){
    backStack.push({...state});
    if(backStack.length>50) backStack.shift();
  }
  suppressBackCapture=false;
  state.route = nextRoute;
  if(state.route!=="mission") state.tab=null;
  render();
}
window.addEventListener("hashchange",readHash);

/* ---------- Global search ---------- */
(function(){
  const input=$("#gsearchInput"), results=$("#gsearchResults");
  let items=[];

  function closeSearch(){ results.classList.remove("open"); results.innerHTML=""; items=[]; }
  function renderRow(it){
    results.append(el("button",{onclick:()=>{ it.go(); closeSearch(); input.value=""; input.blur(); }},
      el("span",{},it.label), el("span",{class:"sub"}, it.sub)));
  }
  function runSearch(q){
    q=q.trim().toLowerCase();
    if(!q){ closeSearch(); return; }
    const assets=DB.assets.filter(a=>a.name.toLowerCase().includes(q)).slice(0,5)
      .map(a=>({ label:a.name, sub:a.asset_type==="drone"?"Drone":"Station",
        go:()=>{ state.asset=a.id; go("asset"); } }));
    const missions=DB.missions.filter(m=>m.name.toLowerCase().includes(q)).slice(0,5)
      .map(m=>({ label:m.name, sub:m.status==="active"?"Active":"Disabled",
        go:()=>{ state.mission=m.id; go("mission"); } }));
    const users=can("user.read") ? DB.users.filter(u=>
        u.display_name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)).slice(0,5)
      .map(u=>({ label:u.display_name, sub:u.email,
        go:()=>{ go("users"); } })) : [];

    items=[...assets, ...missions, ...users];
    results.innerHTML="";
    if(!items.length){
      results.append(el("div",{class:"empty"},"No results for « "+q+" »."));
    } else {
      if(assets.length){ results.append(el("div",{class:"grp"},"Assets")); assets.forEach(renderRow); }
      if(missions.length){ results.append(el("div",{class:"grp"},"Missions")); missions.forEach(renderRow); }
      if(users.length){ results.append(el("div",{class:"grp"},"Users")); users.forEach(renderRow); }
    }
    results.classList.add("open");
  }
  input.addEventListener("input", e=>runSearch(e.target.value));
  input.addEventListener("keydown", e=>{
    if(e.key==="Escape"){ closeSearch(); input.blur(); }
    if(e.key==="Enter" && items[0]){ items[0].go(); closeSearch(); input.value=""; input.blur(); }
  });
  document.addEventListener("click", e=>{ if(!$("#gsearch").contains(e.target)) closeSearch(); });
})();

        const cur=ROUTES.flatMap(g=>g.items).find(i=>i.id===state.route);
        if(cur && !allowed(cur)) return go("map");
        render();
      }},
      ...["operator","admin","super"].map(r=>
        el("option",{value:r, selected:r===state.role?"":null},r)))));
  pop.append(el("div",{class:"menu-sep"}),
    el("button",{class:"menu-item", role:"menuitem", style:"color:#f0a5a5",
      onclick:()=>{ closePop(); modal({ title:"Close the session ?",
        body: el("p",{class:"muted"},"You will need to enter your password again to return."),
        confirm:"Close the session", danger:true,
        onConfirm:()=>{ $("#app").classList.add("hidden"); $("#mobilenav").classList.add("hidden");
          $("#auth").classList.remove("hidden"); }}); }},
      "Close the session"));
  return pop;
}

  if(e.key!=="Escape") return;
  if($(".scrim")) $(".scrim").remove(); else closePop();
});
