/* ============================================================
   ATTENTION STATE
   A single place decides what deserves to be flagged, so that the
   map, the banner and the dashboard never diverge.
   The thresholds are those of the dashboard: 20% battery, error
   state, absence of transmission.
   ============================================================ */
function assetAttention(a){
  if(a.state==="disabled")      return null;   /* intentionally out of service */
  if(a.state==="unprovisioned") return { level:"warn", why:"no token issued" };
  if(a.battery<=10)             return { level:"crit", why:"critical battery — "+a.battery+" %" };
  if(a.battery<=20)             return { level:"warn", why:"low battery — "+a.battery+" %" };
  if(a.health==="error")        return { level:"crit", why:"device in error" };
  if(a.reports===0)             return { level:"warn", why:"no transmission" };
  return null;
}
const attentionList = () => DB.assets
  .map(a=>({a, at:assetAttention(a)}))
  .filter(x=>x.at)
  .sort((x,y)=> (y.at.level==="crit") - (x.at.level==="crit"));
const attnColor = lvl => getCSS(lvl==="crit" ? "--danger" : "--warn");

/* Ring placed under the device: it signals without hiding the silhouette. */
function attentionRing(map, a, at){
  return new google.maps.Marker({
    map, position:{lat:a.lat,lng:a.lng}, clickable:false, zIndex:2,
    icon:{ path:google.maps.SymbolPath.CIRCLE, scale:17,
           fillColor:attnColor(at.level), fillOpacity:.16,
           strokeColor:attnColor(at.level), strokeWeight:2, strokeOpacity:.9 }
  });
}

function assetMarker(map,a,onClick,hover){
  const size = a.asset_type==="drone" ? 46 : 38;
  const m=new google.maps.Marker({
    map, position:{lat:a.lat,lng:a.lng}, title:a.name,
    zIndex: a.state==="active" ? 4 : 2,
    icon:{ url: svgIcon(assetBody(a), size, a.asset_type==="drone" ? (a.heading||0) : 0),
           scaledSize: new google.maps.Size(size,size),
           anchor: new google.maps.Point(size/2, size/2) }
  });
  m.addListener("click",()=>onClick&&onClick(a));
  if(hover){
    m.addListener("mouseover",()=>hover.show(m.getPosition(), assetHoverContent(a)));
    m.addListener("mouseout",()=>hover.hide());
  }
  return m;
}
/* Exclusion zone: tint + dashed outline, never color alone */
function areaShape(map, area, color, hover, mission){
  const isEx = area.type==="exclusion";
  const safeArea = normalizeZonePoints(area.points);
  /* Dark saturated fill to anchor the zone on the background,
     light outline so the boundary stays sharp even on satellite. */
  const fill   = isEx ? getCSS("--zone-ex")      : (color || getCSS("--zone-op"));
  const stroke = isEx ? getCSS("--zone-ex-line") : getCSS("--zone-op-line");
  const poly=new google.maps.Polygon({
    map, paths:safeArea.length>=3 ? safeArea : [{lat:0,lng:0},{lat:0,lng:1},{lat:1,lng:1}],
    strokeColor: stroke, strokeWeight:2, strokeOpacity:.92,
    fillColor: fill, fillOpacity: isEx ? .40 : .46
  });
  poly.zoneId = area.id;
  if(hover && mission){
    /* the polygon follows the pointer: the card is placed where you look */
    poly.addListener("mouseover", e=>hover.show(e.latLng, zoneHoverContent(mission, area)));
    poly.addListener("mousemove", e=>hover.show(e.latLng, zoneHoverContent(mission, area)));
    poly.addListener("mouseout",  ()=>hover.hide());
  }
  if(isEx){
    /* hatching: tint alone must never carry the meaning */
    const hatch = new google.maps.Polyline({ map, path:[...area.points, area.points[0]],
      strokeOpacity:0, icons:[{ icon:{ path:"M 0,-1.6 0,1.6", strokeOpacity:.85,
        strokeColor:getCSS("--zone-ex-line"), scale:2.6 }, offset:"0", repeat:"10px" }]});
    poly.hatch = hatch;
  }
  return poly;
}

/* ============================================================
   SCREEN — LIVE MAP
   ============================================================ */
function screenMap(){
  const view=$("#view"); view.classList.add("is-map"); view.innerHTML="";
  if(state.scenario==="error"){ view.classList.remove("is-map"); view.append(errorState("the live map")); return; }

  const wrap=el("div",{class:"mapwrap"});
  const node=el("div",{id:"gmap"});
  wrap.append(node);

  const layers={assets:true, wifi:true, bt:true, zones:true};
  const tools=el("div",{class:"map-tools"},
    basemapBar(()=>map),
    el("div",{class:"chipbar", role:"group","aria-label":"Displayed layers"},
      layerChip("Assets","--cls-drone","square", DB.assets.filter(a=>a.state==="active").length,
        ()=>layers.assets, v=>{layers.assets=v;draw();}),
      layerChip("Wi-Fi","--wifi","diamond", DB.ops.wifi.unique,
        ()=>layers.wifi, v=>{layers.wifi=v;draw();}),
      layerChip("Bluetooth","--bt","dot", DB.ops.bt.unique,
        ()=>layers.bt, v=>{layers.bt=v;draw();}),
      layerChip("Zones","--zone-op-line","area", null,
        ()=>layers.zones, v=>{layers.zones=v;draw();})));
  wrap.append(tools);

  /* --- Window timeline ---
     The cursor used to slide over emptiness: nothing indicated where
     something had happened. The strip shows event density per
     bucket, which turns replay into an investigation tool.
     Values are deterministic: the same window gives the same
     silhouette from one display to the next. */
  const TL_BUCKETS = 72;
  const TL_KINDS = [
    ["zone",    "Zone entries", "--dblue-hi"],
    ["alert",   "Alerts",       "--warn"],
    ["capture", "Captures",     "--cls-tablet"],
    ["obs",     "Observations", "--wifi"]
  ];
  function timelineData(){
    let sd = 90812;
    const rnd=()=>{ sd=(sd*1664525+1013904223)>>>0; return sd/4294967296; };
    const out=[];
    for(let i=0;i<TL_BUCKETS;i++){
      const day = Math.sin(i/TL_BUCKETS*Math.PI*2 - 1.6)*0.5+0.5;   /* night trough */
      const busy = (i>18&&i<26) || (i>44&&i<52) ? 1.9 : 1;          /* two shifts */
      out.push({
        obs:     Math.round((3 + rnd()*22) * day * busy),
        zone:    rnd() < .22*busy ? 1+Math.floor(rnd()*3) : 0,
        capture: rnd() < .14*busy ? 1+Math.floor(rnd()*2) : 0,
        alert:   rnd() < .05*busy ? 1 : 0
      });
    }
    return out;
  }
  const TL = timelineData();
  const tlMax = Math.max(...TL.map(b=>b.obs+b.zone*4+b.capture*4+b.alert*6));

  /* time cursor: a single clock drives both map and panel */
  const timeLabel=el("span",{class:"now"},"Live");
  const range=el("input",{type:"range",min:"0",max:"100",value:String(state.cursor),
    "aria-label":"Position in time",
    oninput:e=>{ state.cursor=+e.target.value; state.time = state.cursor>=100?"live":"replay"; syncTime(); }});
  function syncTime(){
    const live = state.time==="live";
    timeLabel.textContent = live ? "Live" : "Replay — " + replayClock(state.cursor);
    $$("#tbSeg button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.m===state.time)));
    if(feedBox) feedBox.style.opacity = live ? "1" : ".55";
    paintTimebar();
    paintCursor();
  }
  /* --- Timeline strip, above the controls --- */
  const tlTrack=el("div",{class:"tl-track", role:"slider", tabindex:"0",
    "aria-label":"Event timeline", "aria-valuemin":"0","aria-valuemax":"100",
    "aria-valuenow":String(state.cursor)});
  const tlRead=el("span",{class:"rd"},"");
  const cursorEl=el("div",{class:"tl-cursor"});
  const nowEl=el("div",{class:"tl-now", style:"right:0"});

  TL.forEach((b,i)=>{
    const total=b.obs+b.zone*4+b.capture*4+b.alert*6;
    const col=el("div",{class:"tl-col",
      title:describeBucket(i,b),
      onclick:()=>seekTo((i+0.5)/TL_BUCKETS*100),
      onmouseenter:()=>{ tlRead.innerHTML=readoutFor(i,b); },
      onmouseleave:()=>{ tlRead.innerHTML=defaultReadout(); }});
    /* stacking from most frequent to rarest: the rare stays visible on top */
    [["obs",b.obs,"--wifi"],["zone",b.zone*4,"--dblue-hi"],
     ["capture",b.capture*4,"--cls-tablet"],["alert",b.alert*6,"--danger"]]
      .forEach(([,v,c])=>{
        if(!v) return;
        col.append(el("span",{style:`height:${(v/tlMax*100).toFixed(1)}%; background:${getCSS(c)}`}));
      });
    tlTrack.append(col);
  });
  tlTrack.append(cursorEl, nowEl);
  tlTrack.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
      e.preventDefault();
      seekTo(Math.max(0,Math.min(100, state.cursor + (e.key==="ArrowRight"?1.4:-1.4))));
    }
  });

  function describeBucket(i,b){
    return replayClock((i+0.5)/TL_BUCKETS*100)+" — "+
      b.obs+" observations, "+b.zone+" zone entries, "+
      b.capture+" capture(s), "+b.alert+" alert(s)";
  }
  function readoutFor(i,b){
    return "<b>"+replayClock((i+0.5)/TL_BUCKETS*100)+"</b>  "+
      b.obs+" obs · "+b.zone+" zone · "+b.capture+" img"+(b.alert?" · "+b.alert+" alert":"");
  }
  function defaultReadout(){
    const t=TL.reduce((a,b)=>({obs:a.obs+b.obs,zone:a.zone+b.zone,
      capture:a.capture+b.capture,alert:a.alert+b.alert}),{obs:0,zone:0,capture:0,alert:0});
    return "<b>"+fmt(t.obs)+"</b> obs · <b>"+t.zone+"</b> zone · <b>"+t.capture+
           "</b> img · <b>"+t.alert+"</b> alert"+(t.alert>1?"s":"");
  }
  function seekTo(pct){
    state.cursor=Math.round(pct);
    state.time = state.cursor>=99 ? "live" : "replay";
    range.value=String(state.cursor);
    syncTime();
  }
  function paintCursor(){
    cursorEl.style.left = state.cursor+"%";
    cursorEl.style.display = state.time==="live" ? "none" : "block";
    tlTrack.setAttribute("aria-valuenow", String(state.cursor));
  }

  /* Live, the timeline is not consulted: the bar shrinks to
     a pill anchored to the left. It only expands in replay,
     that is, at the moment one is looking for an instant. */
  const tlBlock = el("div",{class:"tl"},
    el("div",{class:"tl-head"},
      el("span",{},"Activity in the window"),
      el("div",{class:"tl-keys"},
        ...TL_KINDS.map(([,label,c])=>el("span",{},
          el("i",{style:"background:"+getCSS(c)}), label))),
      tlRead),
    tlTrack);
  const rangeRow = el("div",{class:"tb-range"}, range, timeLabel);
  const timebar=el("div",{class:"timebar"}, rangeRow, tlBlock);
  /* Live/Replay toggle now sits on the same row as the layer filters,
     at the top of the map — only the expanded replay controls
     (slider + activity strip) stay anchored at the bottom. */
  const segBar=el("div",{class:"seg", id:"tbSeg", role:"group","aria-label":"Time mode"},
    el("button",{"data-m":"replay","aria-pressed":"false",
      onclick:()=>{ state.time="replay"; state.cursor=Math.min(state.cursor,88);
        range.value=state.cursor; syncTime(); }},"Replay"),
    el("button",{"data-m":"live","aria-pressed":"true",
      onclick:()=>{ state.time="live"; state.cursor=100; range.value=100; syncTime(); }},"Live"));
  tools.append(segBar);
  tlRead.innerHTML=defaultReadout();
  function paintTimebar(){
    timebar.dataset.mode = state.time==="live" ? "live" : "replay";
    try{ syncTimebarPosition(); }catch(_){}
  }
  paintTimebar();
  wrap.append(timebar);

  /* side panel: list, feed, inspector */
  let feedBox=null, selected=null;
  const panel=el("aside",{class:"mpanel", "aria-label":"Context panel"});
  /* Collapsed on open: the map is the point of the screen. The panel
     expands on its own as soon as an element is selected to inspect. */
  panel.dataset.collapsed = "true";
  const grip=el("div",{class:"grip", title:"Resize"});
  panel.append(grip);
  panel.append(el("div",{class:"mpanel-head"},
    panelToggle(panel, ()=>syncBarsSoon(), "Situation"),
    el("h2",{},"Situation"),
    el("div",{class:"right"},
      el("span",{class:"badge badge-brand"}, DB.assets.filter(a=>a.state==="active").length+" active"))));

  const tabsRow=el("div",{class:"tabs", role:"tablist"});
  const body=el("div",{class:"mpanel-body"});
  const TABS=[["assets","Assets",DB.assets.length],["feed","Feed",DB.feed.length],["insp","Detail",null]];
  let tab="assets";
  TABS.forEach(([id,label,cnt])=>{
    tabsRow.append(el("button",{class:"tab", role:"tab", "aria-selected":String(tab===id),
      onclick:()=>{ tab=id; $$(".tab",tabsRow).forEach(b=>b.setAttribute("aria-selected","false"));
        event.currentTarget.setAttribute("aria-selected","true"); paint(); }},
      label, cnt!=null?el("span",{class:"cnt"},String(cnt)):null));
  });
  panel.append(tabsRow, body);
  wrap.append(panel);
  view.append(wrap);

  /* The activity bar (timebar) and the panel both float above
     the map. The CSS collapse rules per breakpoint are not enough: the
     actual height of the collapsed panel depends on the content actually
     rendered, not on a fixed percentage. We therefore measure its real
     position rather than guessing — otherwise the timebar stays pinned
     at the top even when the panel, once collapsed, has freed all the
     space below it. */
  /* A selected element must be readable: the panel opens by itself,
     and only in that case. */
  function openPanel(){
    if(panel.dataset.collapsed!=="true") return;
    panel.dataset.collapsed="false";
    panel.__syncToggle && panel.__syncToggle(true);
    syncBarsSoon();
  }

  /* The toolbar stops at the edge of the panel, like the time bar:
     the attention banner never passes beneath it. */
  function syncToolsPosition(){
    const wrapRect=wrap.getBoundingClientRect(), panelRect=panel.getBoundingClientRect();
    if(!wrapRect.width || !panelRect.width) return;
    tools.style.right = isMobileViewport() ? "14px"
      : Math.max(14, wrapRect.right-panelRect.left+10)+"px";
  }

  function syncTimebarPosition(){
    const wrapRect=wrap.getBoundingClientRect(), panelRect=panel.getBoundingClientRect();
    if(!wrapRect.height || !panelRect.height) return;
    const gap=10;
    /* The pill sizes itself to its content: no right constraint
       live. In replay only, it stops at the panel. */
    const live = state.time==="live";
    if(isMobileViewport()){
      timebar.style.right = live ? "auto" : "14px";
      timebar.style.bottom=Math.max(14, wrapRect.bottom-panelRect.top+gap)+"px";
    } else {
      timebar.style.bottom="14px";
      timebar.style.right = live ? "auto"
        : Math.max(14, wrapRect.right-panelRect.left+gap)+"px";
    }
  }
  const syncBars=()=>{ syncTimebarPosition(); syncToolsPosition(); };
  /* The panel has a width transition: measuring right away gives the
     old geometry. We therefore pass once the animation is finished. */
  const syncBarsSoon=()=>{ syncBars(); setTimeout(syncBars, 220); };
  syncBars();
  window.addEventListener("resize", syncBars);
  onPageLeave(()=>window.removeEventListener("resize", syncBars));

  /* panel resizing */
  let dragging=false;
  grip.addEventListener("mousedown",e=>{ dragging=true; e.preventDefault(); });
  window.addEventListener("mousemove",e=>{
    if(!dragging) return;
    const w=Math.min(620,Math.max(300, window.innerWidth-e.clientX-14));
    panel.style.width=w+"px"; syncToolsPosition();
    if(state.time!=="live") timebar.style.right=(w+28)+"px";
  });
  window.addEventListener("mouseup",()=>dragging=false);

  function paint(){
    body.innerHTML="";
    if(state.scenario==="loading"){ body.append(loadingState(5)); return; }
    if(tab==="assets"){
      if(state.scenario==="empty"){
        body.append(emptyState("No asset is transmitting",
          "The sensors are online but no position has been received in the period. Widen the window or launch a mission.",
          "View the last 24 hours", ()=>toast("Window expanded to 24 hours.")));
        return;
      }
      DB.assets.forEach(a=>{
        const row=el("button",{class:"listrow", "aria-selected":String(selected===a.id),
          onclick:()=>{ selected=a.id; tab="insp";
            $$(".tab",tabsRow).forEach((b,i)=>b.setAttribute("aria-selected",String(i===2)));
            map&&map.panTo({lat:a.lat,lng:a.lng}); paint(); draw(); }},
          el("span",{class:"swatch", style:"background:"+(a.state==="disabled"?getCSS("--n600"):assetColor(a))}),
          el("span",{class:"body"},
            el("span",{class:"t"},a.name),
            el("span",{class:"s"}, a.asset_type==="drone"?"Drone":"Station", " · ", a.last)),
          (()=>{ const at=assetAttention(a);
            if(a.state==="disabled") return el("span",{class:"badge"},"disabled");
            if(!at) return el("span",{class:"badge"},a.battery+" %");
            return el("span",{class:"badge "+(at.level==="crit"?"badge-danger":"badge-warn"),
              title:at.why}, a.battery+" %");
          })());
        body.append(row);
      });
    }
    else if(tab==="feed"){
      feedBox=el("div",{class:"feed"});
      if(state.scenario==="empty"){
        body.append(emptyState("Nothing to report",
          "No events in the selected period. Sensors are operating normally.",
          null)); return;
      }
      DB.feed.forEach(f=>feedBox.append(el("div",{class:"feed-item"},
        el("span",{class:"feed-time"},f.t),
        el("span",{class:"feed-txt", html:(f.h?`<b>${f.h}</b> `:"")+f.txt}))));
      body.append(feedBox);
    }
    else{
      const a=DB.assets.find(x=>x.id===selected);
      if(!a){
        body.append(emptyState("No asset selected",
          "Choose an asset to view its position, telemetry and activity.",
          "Open the list", ()=>{ tab="assets";
            $$(".tab",tabsRow).forEach((b,i)=>b.setAttribute("aria-selected",String(i===0))); paint(); }));
        return;
      }
      body.append(el("div",{style:"padding:14px 14px 4px"},
        el("h3",{},a.name),
        el("p",{class:"muted", style:"font-size:12.5px; margin-top:2px"},
          (a.manufacturer||"—")+" "+(a.model||"")+" · "+(a.asset_type==="drone"?"Drone":"Station"))));
      body.append(el("div",{class:"kv"},
        kv("Position", a.lat.toFixed(5)+", "+a.lng.toFixed(5), true),
        kv("Last reading", a.last),
        kv("Ground speed", a.speed?a.speed.toFixed(1)+" m/s":"—"),
        kv("Heading", a.heading?a.heading+"°":"—"),
        kv("Elevation", a.alt+" m"),
        kv("Battery", a.battery+" %", false, a.battery<=20?"warn":null)));
      body.append(el("div",{style:"padding:14px"},
        el("button",{class:"btn", style:"width:100%; justify-content:center",
          onclick:()=>{ state.asset=a.id; go("asset"); }},"Open the asset console")));
    }
  }
  paint(); syncTime();

  /* map rendering */
  let map=null, overlays=[], hover=null;
  loadMaps().then(()=>{
    map=trackMap(new google.maps.Map(node, mapOptions()));
    hover=makeHover(map);
    map.addListener("dragstart",()=>hover&&hover.hide());
    map.addListener("click",()=>hover&&hover.hide());
    draw();
  }).catch(e=>mapFallback(node, e.message));

  function draw(){
    if(!map) return;
    overlays.forEach(o=>{ if(o.hatch) o.hatch.setMap(null); o.setMap(null); }); overlays=[];
    const pts=[];
    if(layers.zones){
      DB.missions.filter(m=>m.status==="active").forEach(m=>{
        m.areas.forEach(z=>{ overlays.push(areaShape(map,z,m.color,hover,m)); pts.push(...z.points); });
      });
    }
    if(layers.assets && state.scenario!=="empty"){
      /* Selection halo: white is occupied by neither the imagery
         nor a data color. */
      const sel = DB.assets.find(x=>x.id===selected);
      if(sel){
        overlays.push(new google.maps.Marker({ map, position:{lat:sel.lat,lng:sel.lng},
          clickable:false, zIndex:3,
          icon:{ path:google.maps.SymbolPath.CIRCLE, scale:19, fillOpacity:0,
                 strokeColor:getCSS("--select"), strokeWeight:2, strokeOpacity:.95 }}));
      }
      /* attention rings, placed before the devices to remain underneath */
      DB.assets.forEach(a=>{
        const at=assetAttention(a);
        if(at) overlays.push(attentionRing(map,a,at));
      });
      DB.assets.forEach(a=>{ overlays.push(assetMarker(map,a,x=>{
        selected=x.id; tab="insp";
        $$(".tab",tabsRow).forEach((b,i)=>b.setAttribute("aria-selected",String(i===2)));
        openPanel(); paint(); draw();
      }, hover)); pts.push({lat:a.lat,lng:a.lng}); });
    }
    if(layers.wifi && state.scenario!=="empty") overlays.push(...cloud("wifi", 12));
    if(layers.bt   && state.scenario!=="empty") overlays.push(...cloud("bt", 9));
    fitTo(map, pts, panel.offsetWidth+30);
    paintAttention();
  }

  /* --- Attention icon + dropdown card ---
     Collapsed by default into a single alert icon: the map stays
     uncluttered, and the detail only appears in a detached card once
     the person asks for it by clicking — it no longer stretches the
     icon itself into a bar. attnOpen persists across repaints (layer
     toggles, asset updates) so it doesn't snap shut under the person. */
  let attnEl=null, attnIdx=0, attnOpen=false;
  function closeAttn(){ if(attnOpen){ attnOpen=false; paintAttention(); } }
  function onAttnOutsideClick(e){ if(attnOpen && !e.target.closest(".attn")) closeAttn(); }
  document.addEventListener("click", onAttnOutsideClick);
  onPageLeave(()=>document.removeEventListener("click", onAttnOutsideClick));

  function paintAttention(){
    attnEl && attnEl.remove();
    if(state.scenario==="empty" || !layers.assets) return;
    const list=attentionList();
    const calm=!list.length;
    attnIdx = calm ? 0 : Math.min(attnIdx, list.length-1);
    const crit=!calm && list.filter(x=>x.at.level==="crit").length;
    const lvl = calm ? null : (crit ? "crit" : "warn");
    const color = calm ? getCSS("--ok") : attnColor(lvl);

    const toggle=el("button",{class:"attn-toggle", "aria-expanded":String(attnOpen),
      title: calm ? "No device needs attention" : "Devices need attention",
      "aria-label": calm ? "No device needs attention" : (list.length>1?"devices need attention":"device needs attention"),
      onclick:()=>{ attnOpen=!attnOpen; paintAttention(); }},
      (()=>{ const ic=icon("alert"); ic.style.color=color; return ic; })(),
      !calm ? el("span",{class:"attn-n"}, String(list.length)) : null);

    attnEl=el("div",{class:"attn", "data-calm":String(calm), role:"status"}, toggle);

    if(attnOpen){
      const card=el("div",{class:"attn-card", role:"menu"});
      if(calm){
        card.append(el("div",{class:"attn-row", disabled:""},
          el("span",{class:"attn-lab"},"No device needs attention")));
      } else {
        const cur=list[attnIdx];
        const focus=(i)=>{
          attnIdx=(i+list.length)%list.length;
          const t=list[attnIdx];
          openPanel();
          selected=t.a.id; tab="insp";
          $$(".tab",tabsRow).forEach((b,k)=>b.setAttribute("aria-selected",String(k===2)));
          map && map.panTo({lat:t.a.lat, lng:t.a.lng});
          paint(); draw();
        };
        card.append(
          el("div",{class:"attn-row", style:"padding-bottom:2px"},
            el("span",{style:"font-weight:600"},
              list.length>1 ? list.length+" devices need attention" : "1 device needs attention")),
          el("button",{class:"attn-row", title:"Center on the device of interest",
            onclick:()=>focus(attnIdx)},
            el("span",{style:"font-weight:600"}, cur.a.name),
            el("span",{class:"attn-lab"}, cur.at.why)),
          list.length>1 ? el("div",{class:"attn-nav"},
            el("button",{"aria-label":"Previous", onclick:()=>focus(attnIdx-1)},"‹"),
            el("span",{class:"attn-lab", style:"font-variant-numeric:tabular-nums"},
              (attnIdx+1)+" / "+list.length),
            el("button",{"aria-label":"Next", onclick:()=>focus(attnIdx+1)},"›")) : null);
      }
      attnEl.append(card);
    }
    tools.append(attnEl);
  }

  /* --- Observation cloud ---
     Each mark is an aggregate, not a single detection; its size
     grows with density. A simple dot rather than a detailed icon: at this
     density a fine glyph becomes noise. Wi-Fi solid, Bluetooth with a
     more pronounced fill to remain visible on satellite imagery. */
  function cloud(type, n){
    const out=[]; const c=CONFIG.MAP_DEFAULT;
    const isWifi = type==="wifi";
    const col = getCSS(isWifi ? "--wifi" : "--bt");
    let seed = isWifi ? 1337 : 4242;
    const rnd = ()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
    for(let i=0;i<n;i++){
      const lat=c.lat+(Math.sin(i*(isWifi?2.7:1.6))*0.018)+(rnd()-0.5)*0.013;
      const lng=c.lng+(Math.cos(i*(isWifi?1.9:2.4))*0.021)+(rnd()-0.5)*0.013;
      const weight = 1+Math.floor(rnd()*4);           /* density of the aggregate */
      /* Each mark carries its aggregate: volume, distinct identities,
         power range and time boundaries. Deterministic, so
         stable from one display to the next. */
      const count = 18 + Math.floor(rnd()*weight*90);
      const rMin  = -(88 + Math.floor(rnd()*10));
      const rMax  = -(40 + Math.floor(rnd()*22));
      const agg = { type, count,
        ident: Math.max(1, Math.round(count*(0.28+rnd()*0.4))),
        fresh: Math.round(count*(0.05+rnd()*0.22)),
        rssiMin: rMin, rssiMax: rMax,
        first: dmhm(Date.now()-Math.floor(rnd()*72)*3600000),
        last:  dmhm(Date.now()-Math.floor(rnd()*90)*60000),
        zone:  rnd()<.6 ? (DB.missions[0].areas[Math.floor(rnd()*DB.missions[0].areas.length)]||{}).name : null };
      const mk = new google.maps.Marker({ map, position:{lat,lng}, clickable:true, zIndex:2,
        title: (isWifi?"Wi-Fi":"Bluetooth")+" — "+fmt(count)+" observations",
        icon:{ path: google.maps.SymbolPath.CIRCLE, scale: 3.4 + weight*0.9,
               fillColor: col, fillOpacity: isWifi ? .9 : .55,
               strokeColor: col, strokeWeight: isWifi ? 1 : 2, strokeOpacity:.95 }});
      if(hover){
        mk.addListener("mouseover", ()=>hover.show(mk.getPosition(), signalHoverContent(agg)));
        mk.addListener("mouseout",  ()=>hover.hide());
      }
      mk.addListener("click", ()=>{ hover&&hover.hide(); go("obs"); });
      out.push(mk);
    }
    return out;
  }

  /* --- Filters: real icon + tint + volume, so that each layer is
         identifiable without reading the label --- */
  function layerChip(label, cssVar, glyph, count, get, set){
    return el("button",{class:"chip", "aria-pressed":String(get()),
      title: label+" — "+(count?fmt(count)+" observations":"map layer"),
      onclick:e=>{ const v=!(e.currentTarget.getAttribute("aria-pressed")==="true");
        e.currentTarget.setAttribute("aria-pressed",String(v)); set(v); }},
      glyphEl(glyph, getCSS(cssVar)), label,
      count ? el("span",{class:"chip-n"}, fmt(count)) : null);
  }
  function glyphEl(kind, color){
    if(kind==="diamond" || kind==="dot"){
      const g=el("span",{class:"glyph"});
      g.style.cssText = kind==="diamond" ? "background:"+color+";border-radius:50%"
        : "border:2px solid "+color+";border-radius:50%;background:transparent";
      return g;
    }
    const wrap=el("span",{class:"glyph"});
    if(kind==="area") wrap.style.cssText="background:"+color+"55;border:1.5px solid "+color+";border-radius:2px";
    else wrap.style.cssText="background:"+color+";border-radius:2px";
    return wrap;
  }

}
function kv(k,v,mono,tone){
  return el("div",{},
    el("div",{class:"k"},k),
    el("div",{class:"v"+(mono?" mono":""), style: tone==="warn"?"color:#e5ae5c":""},v));
}
/* Mission status — badge shared between the Missions screen and
   the Administration › Missions tab, to stay consistent everywhere. */
function missionStatusLabel(m){
  return m.status==="pending" ? "pending" : m.status==="active" ? "active" : "disabled";
}
function missionStatusBadge(m){
  const cls = m.status==="pending" ? "badge-warn" : m.status==="active" ? "badge-ok" : "";
  return el("span",{class:"badge "+cls}, missionStatusLabel(m));

/* Mission approval — reserved for the super account (see PERM["mission.approve"]).
   Shared by the Missions screen and Administration › Missions. */
function approveMission(m, after){
  confirmWithText({ title:"Approve « "+m.name+" » ?",
    body: el("p",{class:"muted"},
      "The mission becomes active and will be able to emit events as soon as its zones are drawn. "+
      (m.requested_by||"Its author")+" will be notified."),
    /* The entered word must describe the act: typing « delete » to approve
       is a contradiction, and a user who does not read ends up typing
       anything without understanding what they validate. */
    word:"approve",
    confirm:"Approve",
    onConfirm:()=>{
      m.status="active"; after&&after();
      toast("Mission « "+m.name+" » approved and activated.",
        ()=>{ m.status="pending"; after&&after(); });

function rejectMission(m, after){
  confirmWithText({ title:"Reject « "+m.name+" » ?",
    word:"reject",
    body: el("p",{class:"muted"},
      "The mission remains registered but disabled. "+
      (m.requested_by||"Its author")+" will be able to modify it and submit it again."),
    confirm:"Reject", danger:true,
    onConfirm:()=>{
      m.status="disabled"; after&&after();
      toast("Mission « "+m.name+" » rejected.",
        ()=>{ m.status="pending"; after&&after(); });
    }});
}
function replayClock(pct){
  const now=new Date(); const d=new Date(now.getTime()-(100-pct)*36*60*1000);
  return d.toLocaleString("en-US",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}

/* ============================================================
   SCREEN — ASSET CONSOLE
   ============================================================ */
/* ============================================================
   AUTHORIZATION — transcription of the §4.6 matrix
   A single source of truth: every screen queries can(), none
   improvises its own rule. The refusal labels serve
   as tooltips on disabled controls.
   ============================================================ */
const PERM = {
  /* operator, administrator and super */
  "profile.self":      ()=>true,
  "ops.read":          ()=>true,
  "mission.write":     ()=>true,   /* missions and zones: operator allowed */
  "routevideo.write":  ()=>true,
  /* administrator and super */
  "asset.write":       r=>r!=="operator",
  "observation.delete":r=>r!=="operator",
  "user.read":         r=>r!=="operator",
  "user.create":       r=>r!=="operator",
  "server.health":     r=>r!=="operator",
  /* administrator and super, with target restriction */
  "user.write":        (r,t)=> r==="super" || (r==="admin" && (!t || t.role!=="super")),
  "user.apikey":       (r,t)=> r==="super" || (r==="admin" && (!t || t.role!=="super")),
  /* super only */
  "audit.read":        r=>r==="super",
  "mission.approve":   r=>r==="super"
};
function can(action, target){
  const rule = PERM[action];
  return rule ? !!rule(state.role, target) : false;
}
function whyNot(action, target){
  if(can(action, target)) return "";
  if(action==="audit.read") return "Reserved for the super account.";
  if(action==="mission.approve") return "Reserved for the super account.";
  if((action==="user.write"||action==="user.apikey") && target && target.role==="super")
    return "An administrator cannot act on the super account.";
  return "Reserved for administrators.";
}
/* Applies the disabled state and its reason in one step. */
function gate(btn, action, target){
  if(!can(action, target)){ btn.disabled=true; btn.title=whyNot(action, target); }
  return btn;
}
function isAdmin(){ return can("asset.write"); }
function assetLabel(t){ return t==="drone" ? "Drone" : "Monitoring station"; }
const CAPS = [
  ["asset.telemetry","Position and telemetry"],
  ["radio.wifi","Wi-Fi detection"],
  ["radio.bluetooth","Bluetooth detection"],
  ["camera.capture","Image capture"]
];

/* Asset form — creation and edition share the same screen */
/* Artifact preview — GET /artifacts/{id}/thumbnail
   The server returns a JPEG thumbnail. Here it is reconstructed
   locally, deterministically, so that the mock works
   offline: this is not a real image. */
function artifactThumb(obs){
  let sd=0; for(const c of (obs.artifact||obs.id)) sd=(sd*31+c.charCodeAt(0))>>>0;
  const rnd=()=>{ sd=(sd*1664525+1013904223)>>>0; return sd/4294967296; };
  const night = rnd()<.45;
  const sky = night ? ["#0d1b2a","#16283d"] : ["#3d5670","#7d94a8"];
  const grd = night ? "#14201a" : "#3f4a33";
  let g="";
  for(let i=0;i<26;i++){                                  /* buildings */

    const x=rnd()*100, w=3+rnd()*9, h=6+rnd()*26;
    g+=`<rect x="${x.toFixed(1)}" y="${(72-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}"
        fill="#000" opacity="${(0.16+rnd()*0.3).toFixed(2)}"/>`;
    if(night && rnd()<.7)
      g+=`<rect x="${(x+w*0.3).toFixed(1)}" y="${(74-h+2).toFixed(1)}" width="1.4" height="1.4"
          fill="#f0c869" opacity="${(0.4+rnd()*0.5).toFixed(2)}"/>`;
  }
  for(let i=0;i<40;i++)                                    /* ground texture */
    g+=`<circle cx="${(rnd()*100).toFixed(1)}" cy="${(72+rnd()*28).toFixed(1)}"
        r="${(0.6+rnd()*2.4).toFixed(1)}" fill="#000" opacity="${(rnd()*0.22).toFixed(2)}"/>`;
  const svg=`<svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient></defs>
    <rect width="100" height="72" fill="url(#s)"/>
    <rect y="72" width="100" height="28" fill="${grd}"/>
    ${g}
    <g stroke="#ffffff" stroke-opacity=".5" stroke-width=".5" fill="none">
      <path d="M4 4 h6 M4 4 v6 M96 4 h-6 M96 4 v6 M4 96 h6 M4 96 v-6 M96 96 h-6 M96 96 v-6"/>
    </g>
  </svg>`;
  return svg;
}
function artifactPreview(obs){
  const box=el("div",{class:"thumb-wrap"});
  const fig=el("div",{class:"thumb", html:artifactThumb(obs)});
  fig.append(el("div",{class:"meta"},
    el("span",{}, hhmmss(obs.at)),
    el("span",{}, obs.lat.toFixed(4)+", "+obs.lng.toFixed(4))));
  box.append(fig,
    el("div",{style:"display:flex; gap:7px; margin-top:8px"},
      el("button",{class:"btn btn-sm", onclick:()=>toast("Opening the image at full resolution.")},
        "View full size"),
      el("button",{class:"btn btn-sm", onclick:()=>toast("Downloading the original file.")},
        "Download")),
    el("p",{class:"cap"},
      "Thumbnail served by /artifacts/"+obs.artifact+"/thumbnail. The full file remains on the server."));
  return box;
}

/* ============================================================
   DEVICE CREDENTIALS — JWT tokens
   A device does not authenticate with a password: it presents
   a signed token that carries its identity, its capabilities and an expiry.
   The token is displayed only at issuance: the server keeps
   only the fingerprint, it cannot display it again.
   ============================================================ */
const hhmm = ()=>new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
const b64url = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))))
  .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");

function issueJwt(asset, cred){
  const header={ alg:"RS256", typ:"JWT", kid:"darta-asset-2026" };
  const payload={
    iss:"https://api.dartasystems.ai",
    aud:"drone-net",
    sub:"asset:"+asset.id,
    jti:cred.id,
    typ:"asset",
    name:asset.name,
    cap:(asset.caps||["asset.telemetry"]),
    iat:Math.floor(cred.issued/1000),
    exp:Math.floor(cred.expires/1000)
  };
  /* Simulated signature: server-side it is produced by the private key. */
  let sig=""; const A="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
  let sd=0; for(const c of cred.id+asset.id) sd=(sd*31+c.charCodeAt(0))>>>0;
  for(let i=0;i<86;i++){ sd=(sd*1664525+1013904223)>>>0; sig+=A[sd%A.length]; }
  return { token: b64url(header)+"."+b64url(payload)+"."+sig, header, payload };
}
const credsOf = a => DB.credentials.filter(c=>c.asset_id===a.id);
const credLive = c => c.status==="active" && c.expires>Date.now();
function credState(c){
  if(c.status==="revoked") return ["revoked","badge-danger"];
  if(c.expires<Date.now())  return ["expired","badge-warn"];
  return ["active","badge-ok"];
}
const daysTo = ts => Math.round((ts-Date.now())/86400000);
const shortDate = ts => new Date(ts).toLocaleDateString("en-US",{day:"2-digit",month:"short",year:"numeric"});
const ago = ts => {
  const d=Date.now()-ts;
  if(d<60000) return "a few seconds ago";
  if(d<3600000) return Math.round(d/60000)+" min ago";
  if(d<86400000) return Math.round(d/3600000)+" h ago";
  return Math.round(d/86400000)+" d ago";
};

/* Position history — still simulated until the API is connected, but
   built as straight legs + turns (like a real patrol route) rather than
   a sinusoid, to avoid suggesting a flight pattern that does not exist.
   Specific to each asset (seed derived from its id): two drones never
   display the same track. The track ends exactly at the current
   position, to connect cleanly to the drone's live marker. Shared by
   the Asset screen and the artifact modal, which both need to draw
   where a device has been. */
function routeFor(a){
  let seed=0; for(let i=0;i<a.id.length;i++) seed=(seed*31+a.id.charCodeAt(i))>>>0;
  const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };

  const raw=[{lat:0, lng:0}];
  let lat=0, lng=0, heading=rnd()*Math.PI*2;
  const legs=6+Math.floor(rnd()*3);
  for(let l=0; l<legs; l++){
    heading += (rnd()-0.5)*2.4;                 // turn between two legs
    const legLen=0.0035+rnd()*0.0045, steps=4+Math.floor(rnd()*3);
    for(let s=0; s<steps; s++){
      lat += (legLen/steps)*Math.cos(heading) + (rnd()-0.5)*0.00025; // slight GPS noise
      lng += (legLen/steps)*Math.sin(heading) + (rnd()-0.5)*0.00025;
      raw.push({lat,lng});
    }
  }
  const endLat=lat, endLng=lng; // last accumulated point = current position
  return raw.map(p=>({ lat:a.lat+(p.lat-endLat), lng:a.lng+(p.lng-endLng) }));
}

  panel.append(body);
  wrap.append(panel); view.append(wrap);

  loadMaps().then(()=>{
    const map=trackMap(new google.maps.Map(node, mapOptions({zoom:14})));
    amap=map;
    const hover=makeHover(map);
    map.addListener("dragstart",()=>hover.hide());
    if(noData){ map.setCenter({lat:a.lat,lng:a.lng}); return; }
    new google.maps.Polyline({ map, path, strokeColor:assetColor(a),
      strokeWeight:3, strokeOpacity:.55 });
    new google.maps.Marker({ map, position:path[0], title:"Start",

  /* Builds the telemetry associated with the trajectory: each point carries
     the instant, speed, altitude, heading, battery and the cumulative
     count of observations. This is what the player replays. */
  function buildTrack(a, path){
    let seed=7; for(let i=0;i<a.id.length;i++) seed=(seed*33+a.id.charCodeAt(i))>>>0;
    const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
    const n=path.length, stepSec=18;
    const startBatt=Math.min(100, a.battery+Math.round(n*stepSec/90));
    let wifi=0, bt=0, dist=0;
    return path.map((p,i)=>{
      if(i>0) dist += haversineM(path[i-1], p);
      const heading = i<n-1 ? bearing(p, path[i+1]) : (a.heading||0);
      const sp = i===0 || i===n-1 ? 0 : 4 + rnd()*9;
      wifi += Math.round(rnd()*a.wifi/n*1.6);
      bt   += Math.round(rnd()*a.bt/n*1.6);
      return {
        pos:p, t:i*stepSec,
        speed: sp, alt: Math.max(0, Math.round((a.alt||40) + Math.sin(i/3)*14 + (rnd()-.5)*6)),
        heading: Math.round(heading),
        batt: Math.max(0, Math.round(startBatt - (startBatt-a.battery)*i/(n-1))),
        wifi: Math.min(a.wifi, wifi), bt: Math.min(a.bt, bt),
        dist
      };
    });
  }
  function haversineM(p,q){
    const R=6371008.8, rad=x=>x*Math.PI/180;
    const dLat=rad(q.lat-p.lat), dLng=rad(q.lng-p.lng);
    const x=Math.sin(dLat/2)**2 + Math.cos(rad(p.lat))*Math.cos(rad(q.lat))*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(x));
  }
  function bearing(p,q){
    const rad=x=>x*Math.PI/180, deg=x=>x*180/Math.PI;
    const y=Math.sin(rad(q.lng-p.lng))*Math.cos(rad(q.lat));
    const x=Math.cos(rad(p.lat))*Math.sin(rad(q.lat))-Math.sin(rad(p.lat))*Math.cos(rad(q.lat))*Math.cos(rad(q.lng-p.lng));
    return (deg(Math.atan2(y,x))+360)%360;
  }
  const clock = sec => String(Math.floor(sec/60)).padStart(2,"0")+":"+String(Math.round(sec%60)).padStart(2,"0");

  /* Hover card content during replay: reproduces the formatting of
     assetHoverContent, but with the values of the replayed instant
     (p) rather than the device's actual last reading. */
  function trackHoverContent(a, p){
    const off = a.state!=="active";
    return el("div",{},
      el("div",{class:"hc-head"},
        el("span",{class:"sw", style:"background:"+(off?getCSS("--n600"):assetColor(a))}),
        el("span",{class:"n"}, a.name),
        el("span",{class:"st"}, "replay · "+clock(p.t))),
      el("div",{class:"hc-body"},
        hcv("Type", a.asset_type==="drone"?"Drone":"Station"),
        hcv("Ground speed", p.speed.toFixed(1)+" m/s"),
        hcv("Heading", p.heading+"°"),
        hcv("Elevation", p.alt+" m"),
        hcv("Distance", (p.dist/1000).toFixed(2).replace(".",",")+" km")),
      el("div",{class:"hc-batt"},
        el("div",{style:"display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-3)"},
          el("span",{},"Battery"),
          el("span",{style:"font-weight:600; color:var(--text)"}, p.batt+" %")),
        el("div",{class:"t"}, el("span",{class:"f",
          style:`width:${p.batt}%; background:${battTone(p.batt)}`}))),
      el("div",{class:"hc-foot"}, p.pos.lat.toFixed(5)+", "+p.pos.lng.toFixed(5)));
  }

  /* --- Onboard camera image ---
     Reconstructed from the telemetry of the current point: the horizon
     drops as the device climbs, the ground scrolls with the distance
     travelled, and the buildings shift with the heading. This is not the
     real video — that is produced server-side — but it replays the
     same values, which is enough to place what the device was looking at. */
  function videoFrame(p){
    const W=320, H=180;
    const night = (p.t % 600) > 420;                 /* night flight passage */
    const horizon = Math.max(34, Math.min(96, 104 - p.alt*0.32));
    const sky  = night ? ["#0a1420","#132436"] : ["#43617f","#8fa6b8"];
    const soil = night ? "#0e1a14" : "#43512f";
    let g="";
    /* scrolling: the seed follows the distance travelled */
    const off = (p.dist/6) % 60;
    for(let i=0;i<9;i++){
      const x = ((i*60 - off) + 60) % 380 - 30;
      const persp = 0.5 + i%3*0.25;
      const bh = 16 + (i*37 % 34) * persp;
      const bw = 20 + (i*23 % 22);
      g += `<rect x="${x.toFixed(1)}" y="${(H-bh-((i%4)*9)).toFixed(1)}" width="${bw}" height="${bh}"
              fill="#000" opacity="${(0.24+ (i%3)*0.09).toFixed(2)}"/>`;
      if(night && i%2===0)
        g += `<rect x="${(x+bw*0.35).toFixed(1)}" y="${(H-bh-((i%4)*9)+4).toFixed(1)}"
                width="2.4" height="2.4" fill="#f0c869" opacity=".75"/>`;
    }
    /* receding roads */
    let roads="";
    for(let i=0;i<4;i++){
      const x0 = 40 + i*80 - off*0.6;
      roads += `<path d="M${x0.toFixed(1)} ${H} L${(160 + (x0-160)*0.18).toFixed(1)} ${horizon+6}"
                 stroke="#000" stroke-opacity=".22" stroke-width="${(9-i).toFixed(0)}" fill="none"/>`;
    }
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="vsky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient>
        <radialGradient id="vig" cx="50%" cy="50%" r="72%">
          <stop offset=".55" stop-color="#000" stop-opacity="0"/>
          <stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
      </defs>
      <rect width="${W}" height="${horizon}" fill="url(#vsky)"/>
      <rect y="${horizon}" width="${W}" height="${H-horizon}" fill="${soil}"/>
      ${roads}${g}
      <rect width="${W}" height="${H}" fill="url(#vig)"/>
      <!-- reticle and frame markers -->
      <g stroke="#f2f5f7" stroke-opacity=".62" stroke-width="1.1" fill="none">
        <path d="M152 90 h-11 M168 90 h11 M160 82 v-11 M160 98 v11"/>
        <path d="M14 14 h13 M14 14 v13 M306 14 h-13 M306 14 v13
                 M14 166 h13 M14 166 v-13 M306 166 h-13 M306 166 v-13"/>
      </g>
      <circle cx="160" cy="90" r="2" fill="none" stroke="#f2f5f7" stroke-opacity=".62"/>
      <!-- artificial horizon line -->
      <g stroke="#2fd6ae" stroke-opacity=".55" stroke-width="1">
        <line x1="96" y1="${horizon.toFixed(1)}" x2="132" y2="${horizon.toFixed(1)}"/>
        <line x1="188" y1="${horizon.toFixed(1)}" x2="224" y2="${horizon.toFixed(1)}"/>
      </g>
    </svg>`;
  }

  /* Player: replays the recorded position and telemetry.
     The values displayed here are those of the replayed instant, never
     confused with the device's actual last reading in the panel. */
  function makePlayer(map, a, track, hover){
    const last=track.length-1, total=track[last].t;
    let idx=0, playing=false, rate=1, raf=null, prev=0, acc=0;

    const trail=new google.maps.Polyline({ map, path:[track[0].pos],
      strokeColor:getCSS("--select"), strokeWeight:4, strokeOpacity:1, zIndex:5 });
    const head=new google.maps.Marker({ map, position:track[0].pos, zIndex:6,
      icon:{ path:google.maps.SymbolPath.FORWARD_CLOSED_ARROW, scale:6,
        fillColor:getCSS("--select"), fillOpacity:1,
        strokeColor:"#0b0d0f", strokeWeight:1.6, rotation:track[0].heading }});
    trail.setMap(null); head.setMap(null);
    /* Hovering over the marker during replay: shows the telemetry of
       the replayed instant (current idx), not the actual last reading —
       otherwise the popup numbers would contradict those shown under the player. */
    if(hover){
      head.addListener("mouseover",()=>hover.show(head.getPosition(), trackHoverContent(a, track[idx])));
      head.addListener("mouseout",()=>hover.hide());
    }

    const f={};
    const field=(k,key,unit)=>{ const v=el("div",{class:"v"},"—"); f[key]={node:v,unit};
      return el("div",{}, el("div",{class:"k"},k), v); };
    const slider=el("input",{type:"range", min:"0", max:String(last), value:"0",
      "aria-label":"Position in the trajectory",
      oninput:e=>{ pause(); seek(+e.target.value); }});
    const clockEl=el("span",{class:"vb-clock"},"00:00 / "+clock(total));
    const prog=el("span",{class:"f"});
    const playBtn=el("button",{class:"vb-play","aria-label":"Play",
      onclick:()=>playing?pause():play()},"▶");
    const rateBtn=el("button",{class:"btn btn-sm", onclick:()=>{
      rate = rate===1?2:rate===2?4:1; rateBtn.textContent="×"+rate; }},"×1");

    const fsOverlay = el("div", { class: "video-fullscreen" },
      el("div", { class: "frame" },
        el("button", { class: "btn btn-sm btn-quiet close", onclick:()=>{ fsOverlay.classList.remove("open"); } }, "✕"),
        el("div", { class: "screen" })));
    document.body.append(fsOverlay);

    function openFullscreen(){
      const inner = fsOverlay.querySelector(".screen");
      if (!inner) return;
      inner.innerHTML = screen.innerHTML;
      fsOverlay.classList.add("open");
    }
    const downloadBtn=el("button",{class:"btn btn-sm btn-primary", onclick:()=>{
      toast("Downloading the trajectory video.");
    }},"Download");

    /* Overlay elements: they reproduce the telemetry of the current point,
       not a value invented for display. */
    const screen=el("div",{}); screen.innerHTML=videoFrame(track[0]);
    screen.addEventListener("click", openFullscreen);
    const recTxt=el("span",{},"REC");
    const tcTxt =el("span",{},"00:00:00");
    const osdL  =el("span",{},"");
    const osdR  =el("span",{},"");
    let lastIdx=-1;

    const bar=el("div",{class:"videobar", role:"group","aria-label":"Trajectory playback"},
      el("div",{class:"vb-head"},
        el("span",{class:"ttl"},"Video trajectory — "+a.name),
        el("div",{class:"right"},
          el("span",{class:"badge badge-brand"}, fmt(track.length)+" points"),
          rateBtn,
          downloadBtn,
          el("button",{class:"btn btn-sm btn-quiet","aria-label":"Close the player",
            onclick:()=>close()},"✕"))),
      el("div",{class:"vb-stage"},
        el("div",{class:"vb-screen"}, screen,
          el("div",{class:"vb-noise"}),
          el("div",{class:"vb-rec"}, el("span",{class:"d"}), recTxt),
          el("div",{class:"vb-tc"}, tcTxt),
          el("div",{class:"vb-osd"}, osdL, osdR)),
        el("div",{class:"vb-side"},
          el("div",{class:"vb-ctrl"}, playBtn, slider, clockEl),
          el("div",{class:"vb-fields"},
            field("Speed","speed"), field("Elevation","alt"),
            field("Heading","heading"), field("Distance","dist")))),
      el("div",{class:"vb-prog"}, prog));

    function paintFrame(){
      const p=track[idx];
      head.setPosition(p.pos);
      head.setIcon({ path:google.maps.SymbolPath.FORWARD_CLOSED_ARROW, scale:6,
        fillColor:getCSS("--select"), fillOpacity:1,
        strokeColor:"#0b0d0f", strokeWeight:1.6, rotation:p.heading });
      trail.setPath(track.slice(0,idx+1).map(x=>x.pos));
      f.speed.node.textContent = p.speed.toFixed(1)+" m/s";
      f.alt.node.textContent   = p.alt+" m";
      f.heading.node.textContent = p.heading+"°";
      if(idx!==lastIdx){
        lastIdx=idx;
        screen.innerHTML=videoFrame(p);
        const fsScreen = fsOverlay.querySelector(".screen");
        if (fsOverlay.classList.contains("open") && fsScreen) fsScreen.innerHTML = screen.innerHTML;
        const hh=String(Math.floor(p.t/3600)).padStart(2,"0");
        tcTxt.textContent = hh+":"+clock(p.t%3600);
        osdL.textContent  = "ALT "+p.alt+"m  SPD "+p.speed.toFixed(1);
        osdR.textContent  = "HDG "+String(p.heading).padStart(3,"0")+"°  BAT "+p.batt+"%";
        recTxt.textContent = playing ? "REC" : "PAUSE";
        f.dist.node.textContent = (p.dist/1000).toFixed(2).replace(".",",")+" km";
      }
      slider.value=String(idx);
      clockEl.textContent = clock(p.t)+" / "+clock(total);
      prog.style.width = (idx/last*100)+"%";
      if(!map.getBounds()?.contains(new google.maps.LatLng(p.pos.lat,p.pos.lng))) map.panTo(p.pos);
    }
    function seek(i){ idx=Math.max(0,Math.min(last,i)); paintFrame(); }
    function step(ts){
      if(!playing) return;
      if(!prev) prev=ts;
      acc += (ts-prev)*rate; prev=ts;
      const frame=380;                       /* ms per point at ×1 speed */
      while(acc>=frame && idx<last){ idx++; acc-=frame; }
      paintFrame();
      if(idx>=last){ pause(); return; }
      raf=requestAnimationFrame(step);
    }
    function play(){
      if(idx>=last) idx=0;
      playing=true; prev=0; acc=0; playBtn.textContent="❚❚"; recTxt.textContent="REC";
      playBtn.setAttribute("aria-label","Pause");
      raf=requestAnimationFrame(step);
    }
    function pause(){
      playing=false; recTxt.textContent="PAUSE";
      if(raf) cancelAnimationFrame(raf); raf=null;
      playBtn.textContent="▶"; playBtn.setAttribute("aria-label","Play");
    }
    function open(){
      trail.setMap(map); head.setMap(map);
      wrap.append(bar); seek(0); play();
    }
    function close(){
      pause(); trail.setMap(null); head.setMap(null); bar.remove();
    }
    return { open, close, isOpen:()=>bar.isConnected };
  }

  /* Generation: progress is shown before playback, as the real
     server-side render will. */
  function generateVideo(btn){
    if(!track){ toast("No trajectory to replay for this period."); return; }
    if(player && player.isOpen()){ player.close(); }
    const label=btn.textContent;
    btn.disabled=true;
    let pct=0;
    const tick=setPageInterval(()=>{
      pct+=8+Math.random()*12;
      btn.textContent = "Generating… "+Math.min(100,Math.round(pct))+" %";
      if(pct>=100){
        clearInterval(tick); btn.disabled=false; btn.textContent=label;
        if(player) player.open();
        else toast("The map must be loaded to replay the trajectory.");
      }
    }, 130);
  }

}

        c.append(el("div",{style:"margin:0 14px 12px; padding:9px 11px; border-radius:var(--r-sm); "+

  let map=null, shapes=[], hover=null, toolbarEl=null, escHandler=null, drawState=null;

  function showDrawToolbar(text, actions, onEscape, extraNode){
    hideDrawToolbar();
    toolbarEl = el("div",{class:"draw-toolbar"},
      el("span",{class:"txt"}, text),
      extraNode || null,
      el("div",{class:"acts"}, actions.map(a=>
        el("button",{class:"btn btn-sm "+(a.variant||""), onclick:a.onClick}, a.label))));
    wrap.append(toolbarEl);
    escHandler = e=>{ if(e.key==="Escape") (onEscape||actions[0].onClick)(); };
    document.addEventListener("keydown", escHandler);
  }
  function hideDrawToolbar(){
    if(toolbarEl){ toolbarEl.remove(); toolbarEl=null; }
    if(escHandler){ document.removeEventListener("keydown", escHandler); escHandler=null; }
  }
  /* Manual drawing on click — the "drawing" library was removed from the Maps JS API (v3.65+),
     so we build the polygon ourselves with a simple click listener. */
  function refreshDrawToolbarLabel(){
    if(!drawState) return;
    const n = drawState.path.length;
    /* The zone delimits itself as vertices go down — no extra step to see
       its extent while drawing — and the name can be typed in right here,
       during the trace, instead of only being asked once drawing is over. */
    const label = n===0
      ? "Click on the map to place the first vertex of the zone."
      : "Vertex "+n+" placed"+(n>=3 ? " · "+areaKm2(drawState.path).toFixed(2).replace(".",",")+" km² so far" : "")+
        " — continue, or finish with at least 3 vertices.";
    const nameField = el("input",{class:"input", style:"width:160px; height:29px; font-size:12.5px",
      placeholder:"Zone name", value:drawState.name, "aria-label":"Zone name",
      oninput:e=>{ drawState.name=e.target.value; }});
    showDrawToolbar(label,
      [
        {label:"Cancel drawing", variant:"btn-quiet", onClick:cancelDraw},
        {label:"Finish drawing", variant:"btn-primary", onClick:finishDraw}
      ], cancelDraw, nameField);
  }
  function startDrawZone(m){
    const mm=DB.missions.find(x=>x.id===state.mission);
    if(mm && mm.areas.length>=MAX_AREAS){
      modal({ title:"Zone limit reached",
        body: el("p",{class:"muted"},
          "A mission cannot exceed "+MAX_AREAS+" zones. Delete one before drawing a new one."),
        confirm:"Understood" });
      return;
    }
    if(!map) return;
    cancelDraw();
    state.mission = m.id;
    map.setOptions({draggableCursor:"crosshair"});
    drawState = { path:[], polygon:null, markers:[], name:"Zone "+((mm&&mm.areas.length||0)+1),
      clickListener: map.addListener("click", e=>addDrawPoint(e.latLng)) };
    refreshDrawToolbarLabel();
  }
  /* Contract limits: 10 zones per mission, 1,000 vertices per polygon. */

  function addDrawPoint(latLng){
    if(!drawState) return;
    if(drawState.path.length>=MAX_POINTS){
      toast("Limit reached: "+fmt(MAX_POINTS)+" vertices per polygon.");
      return;
    }
    drawState.path.push({lat:latLng.lat(), lng:latLng.lng()});
    if(!drawState.polygon){
      drawState.polygon = new google.maps.Polygon({
        map, paths:drawState.path, clickable:false,
        strokeColor:getCSS("--zone-op-line"), strokeWeight:2, strokeOpacity:.95,
        fillColor:getCSS("--zone-op"), fillOpacity:.42
      });
    } else {
      drawState.polygon.setPath(drawState.path);
    }
    drawState.markers.push(new google.maps.Marker({
      map, position:latLng, clickable:false,
      icon:{ path: google.maps.SymbolPath.CIRCLE, scale:4,
        fillColor:"#ffffff", fillOpacity:1, strokeColor:getCSS("--zone-op-line"), strokeWeight:2 }
    }));
    refreshDrawToolbarLabel();
  }
  function cancelDraw(){
    hideDrawToolbar();
    if(map) map.setOptions({draggableCursor:null});
    if(!drawState) return;
    google.maps.event.removeListener(drawState.clickListener);
    drawState.polygon && drawState.polygon.setMap(null);
    drawState.markers.forEach(mk=>mk.setMap(null));
    drawState = null;
  }
  function finishDraw(){
    if(!drawState || drawState.path.length<3){ toast("At least 3 vertices are required to finish a zone."); return; }
    const path = drawState.path.slice();
    const drawnName = drawState.name;
    google.maps.event.removeListener(drawState.clickListener);
    drawState.polygon && drawState.polygon.setMap(null);
    drawState.markers.forEach(mk=>mk.setMap(null));
    drawState = null;
    if(map) map.setOptions({draggableCursor:null});
    hideDrawToolbar();
    finishNewZone(path, drawnName);
  }
  function finishNewZone(path, presetName){
    const m=DB.missions.find(x=>x.id===state.mission);
    if(!m){ return; }
    let nameVal=(presetName||"").trim()||("Zone "+(m.areas.length+1)), typeVal="operating";
    let safePath=[];
    try{ safePath = normalizeZonePoints(path); }
    catch(err){ toast(err.message); return; }
    modal({
      title:"New zone",
      body: el("div",{style:"display:flex; flex-direction:column; gap:12px"},
        el("label",{style:"display:flex; flex-direction:column; gap:5px; font-size:12.5px"},
          "Zone name",
          el("input",{class:"input", value:nameVal, oninput:e=>nameVal=e.target.value})),

/* approximate geodesic area — never a planar calculation */
function areaKm2(pts){
  const R=6371.0088, rad=x=>x*Math.PI/180;
  let s=0;
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length];
    s += (rad(b.lng)-rad(a.lng))*(2+Math.sin(rad(a.lat))+Math.sin(rad(b.lat)));
  }
  return Math.abs(s*R*R/2);
}
function polygonCoordinateText(points){
  if(!Array.isArray(points) || !points.length) return "";
  return points.map(p=>Number(p.lat).toFixed(6)+", "+Number(p.lng).toFixed(6)).join("\n");
}
function parseCoordinateList(raw){
  const text = String(raw || "").trim();
  if(!text){ throw new Error("Enter at least 3 polygon coordinates."); }
  const points=[];
  for(const line of text.split(/\n+/)){
    const parts = line.split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
    if(parts.length < 2) continue;
    const lat = Number(parts[0]);
    const lng = Number(parts[1]);
    if(!Number.isFinite(lat) || !Number.isFinite(lng)) continue;
    points.push({ lat, lng });
  }
  if(points.length < 3){ throw new Error("A polygon needs at least 3 points."); }
  return points;
}
function generatePolygonFromCenter(center, sides, radiusM){
  sides = Math.max(3, Number(sides) || 5);
  radiusM = Math.max(20, Number(radiusM) || 350);
  const pts=[];
  for(let i=0;i<sides;i++){
    const ang = (i/sides)*2*Math.PI - Math.PI/2;
    const east = Math.cos(ang) * (radiusM / 111320);
    const north = Math.sin(ang) * (radiusM / 111320);
    pts.push({
      lat: center.lat + north,
      lng: center.lng + east / Math.cos(center.lat*Math.PI/180)
    });
  }
  return pts;
}
function buildZoneShapePoints(center, shape){
  if(shape && shape.kind === "polygon"){
    const raw = Array.isArray(shape.points) && shape.points.length ? polygonCoordinateText(shape.points)
      : (typeof shape.text === "string" ? shape.text : "");
    if(raw){ return validateZonePoints(parseCoordinateList(raw)); }
    return validateZonePoints(generatePolygonFromCenter(center, 5, shape.radius || 350));
  }
  return validateZonePoints(generateZonePoints(center, shape.kind, shape));
}
function normalizeZonePoints(points){
  if(!Array.isArray(points) || points.length===0){
    throw new Error("A zone must contain at least 3 valid coordinates.");
  }
  const clean=[];
  for(const p of points){
    if(!p || typeof p !=="object") continue;
    const lat = Number(p.lat), lng = Number(p.lng);
    if(!Number.isFinite(lat) || !Number.isFinite(lng)) continue;
    const safeLat = Math.max(-90, Math.min(90, lat));
    const safeLng = (((lng + 180) % 360) + 360) % 360 - 180;
    const pt={lat:safeLat, lng:safeLng};
    if(!clean.length || Math.abs(clean[clean.length-1].lat-pt.lat)>1e-9 || Math.abs(clean[clean.length-1].lng-pt.lng)>1e-9){
      clean.push(pt);
    }
  }
  if(clean.length < 3){
    throw new Error("A zone must have at least 3 vertices.");
  }
  if(clean.length > MAX_POINTS){
    throw new Error("Polygon too detailed: "+fmt(MAX_POINTS)+" vertices maximum.");
  }
  if(clean.length > 1 && Math.abs(clean[0].lat-clean[clean.length-1].lat)<1e-9 && Math.abs(clean[0].lng-clean[clean.length-1].lng)<1e-9){
    clean.pop();
  }
  if(clean.length < 3){
    throw new Error("A zone must have at least 3 vertices.");
  }
  return clean;
}
function validateZonePoints(points){
  const normalized = normalizeZonePoints(points);
  if(!Number.isFinite(areaKm2(normalized)) || areaKm2(normalized) <= 0){
    throw new Error("The polygon coordinates do not form a valid zone.");
  }
  return normalized;
}
/* Generate a zone polygon from a center + dimensions, for people who would
   rather type a size than click vertices on the map. Flat-earth offset
   around the center is precise enough at the scale of an operating zone. */
function metersToLatLng(center, dxEastM, dyNorthM){
  return { lat: center.lat + dyNorthM/111320,
           lng: center.lng + dxEastM/(111320*Math.cos(center.lat*Math.PI/180)) };
}
function rectZonePoints(center, widthM, heightM){
  const hw=widthM/2, hh=heightM/2;
  return [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([dx,dy])=>metersToLatLng(center,dx,dy));
}
function circleZonePoints(center, radiusM, sides){
  sides = sides || 32;
  const pts=[];
  for(let i=0;i<sides;i++){
    const ang=(i/sides)*2*Math.PI;
    pts.push(metersToLatLng(center, radiusM*Math.cos(ang), radiusM*Math.sin(ang)));
  }
  return pts;
}
function generateZonePoints(center, kind, dims){
  const pts = kind==="circle" ? circleZonePoints(center, dims.radius) : rectZonePoints(center, dims.width, dims.height);
  return validateZonePoints(pts);
}

const DASH_VISIBLE_KEY = "darta.dashboard.visible.v1";
const DASH_DEFAULT_VISIBLE = ["wifi","bt"];
const DASH_PANELS = [
  { id:"wifi",      label:"Wi-Fi" },
  { id:"bt",        label:"Bluetooth" },
  { id:"rssi",      label:"Transmitter distance" },
  { id:"bands",     label:"Frequency bands" },
  { id:"fleet",     label:"Fleet" },
  { id:"footprint", label:"Spatial footprint" },
  { id:"assets",    label:"Assets" },
  { id:"stream",    label:"Live activity" },
  { id:"health",    label:"Server health", perm:"server.health" }
];

function loadVisiblePanels(){
  try {
    const raw = localStorage.getItem(DASH_VISIBLE_KEY);
    if(!raw) return [...DASH_DEFAULT_VISIBLE];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed.filter(Boolean) : [...DASH_DEFAULT_VISIBLE];
  } catch (error) {
    return [...DASH_DEFAULT_VISIBLE];
  }
}

function saveVisiblePanels(ids){
  try { localStorage.setItem(DASH_VISIBLE_KEY, JSON.stringify(ids)); } catch (error) {}
}

function openDashCustomize(visible, rerender){
  const options = DASH_PANELS.filter(p => !p.perm || can(p.perm));
  const boxes = options.map(p => el("label",{class:"dash-opt"},
    el("input",{type:"checkbox", value:p.id, checked: visible.includes(p.id)?"":null}),
    el("span",{}, p.label)));
  const list = el("div",{class:"dash-opt-list"}, ...boxes);
  modal({
    title:"Customize dashboard",
    body: el("div",{},
      el("p",{class:"muted", style:"margin-bottom:10px"},
        "Choose which cards to show. The counters at the top always stay visible."),
      list),
    confirm:"Apply",
    onConfirm:()=>{
      const ids = boxes
        .filter(b => b.querySelector("input").checked)
        .map(b => b.querySelector("input").value);
      saveVisiblePanels(ids);
      rerender();
    }
  });
}

  let since=0;
